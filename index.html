<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аксон IELTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: экосистема разделов — верхнее меню + карточки; светлая база, уровни A1→C1 от светлого к насыщенному */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --ink:#141a33; --muted:#5d6584; --line:#e1e5f0;
  --accent:#3355e0; --accent-ink:#ffffff; --accent-soft:#e8edff;
  --good:#138a5e; --good-soft:#e2f5ec; --bad:#c43c3c; --bad-soft:#fbe9e9; --warn:#b26b00; --warn-soft:#fff3dc;
  --a1:#cfe0ff; --a2:#a9c4ff; --b1:#7ea2f7; --b2:#4f78ea; --c1:#2c4fc4;
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,26,51,.05),0 4px 16px rgba(20,26,51,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#171b2e; --ink:#e8ebf7; --muted:#9aa2c2; --line:#2a3050;
  --accent:#7d97ff; --accent-ink:#0f1220; --accent-soft:#232b52;
  --good:#4cc994; --good-soft:#16352a; --bad:#ff8080; --bad-soft:#3d1d22; --warn:#f0b450; --warn-soft:#3a2c12;
  --a1:#2a3460; --a2:#34437d; --b1:#4058a3; --b2:#5574d6; --c1:#7d97ff;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#171b2e; --ink:#e8ebf7; --muted:#9aa2c2; --line:#2a3050;
  --accent:#7d97ff; --accent-ink:#0f1220; --accent-soft:#232b52;
  --good:#4cc994; --good-soft:#16352a; --bad:#ff8080; --bad-soft:#3d1d22; --warn:#f0b450; --warn-soft:#3a2c12;
  --a1:#2a3460; --a2:#34437d; --b1:#4058a3; --b2:#5574d6; --c1:#7d97ff;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.02rem;font-weight:500}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;height:60px}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--ink);display:flex;gap:8px;align-items:center;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:.8rem}
nav.main{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.main::-webkit-scrollbar{display:none}
nav.main a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;font-size:.95rem}
nav.main a:hover{background:var(--bg);color:var(--ink)}
nav.main a.on{background:var(--accent-soft);color:var(--accent)}
.lvl-pill{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;border:0;cursor:pointer}
main{padding:28px 0 100px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
a.card{text-decoration:none;color:inherit;display:block;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card h3{margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.hero{background:linear-gradient(120deg,var(--accent),#5b3fd6);color:#fff;border-radius:20px;padding:28px;display:grid;gap:18px;grid-template-columns:1.4fr 1fr}
.hero h1{color:#fff}
.hero .btn.pri{background:#fff;color:#2a3aa8;border-color:#fff}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.plan{display:flex;flex-direction:column;gap:8px}
.plan a{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.14);padding:10px 14px;border-radius:12px;color:#fff;text-decoration:none}
.plan a:hover{background:rgba(255,255,255,.24)}
.plan a.done{opacity:.6;text-decoration:line-through}
.plan b{font-variant-numeric:tabular-nums;min-width:46px}
.tile{display:flex;flex-direction:column;gap:2px}
.tile .num{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.lv{border:0;color:#10173a}
.lvA1{background:var(--a1)} .lvA2{background:var(--a2)} .lvB1{background:var(--b1);color:#fff!important} .lvB2{background:var(--b2);color:#fff!important} .lvC1{background:var(--c1);color:#fff!important}
.chip.med{background:var(--good-soft);color:var(--good);border:0}
.chip.ok{background:var(--good-soft);color:var(--good);border:0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.crumbs{font-size:.9rem;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.prose{max-width:70ch}
.prose p{margin:.5em 0}
.eg{background:var(--accent-soft);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.q .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{border:1px solid var(--line);background:var(--bg);padding:8px 14px;border-radius:10px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{margin-top:8px;font-size:.9rem}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.vtable{width:100%;border-collapse:collapse}
.vtable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.vtable td:first-child{font-weight:600;white-space:nowrap}
.tw{overflow-x:auto}
.icon{border:0;background:transparent;cursor:pointer;color:var(--accent);padding:4px;border-radius:6px;font-size:1rem;line-height:1}
.icon:hover{background:var(--accent-soft)}
.flash{min-height:220px;display:grid;place-items:center;text-align:center;cursor:pointer;font-size:1.4rem;border-radius:18px;padding:30px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.flash small{display:block;font-size:.95rem;color:var(--muted);margin-top:10px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
textarea{min-height:240px;resize:vertical;line-height:1.6}
.ai-out{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;white-space:normal}
.ai-out h4{margin:.8em 0 .3em;font-family:var(--f-display);font-weight:500}
.ai-out ul{margin:.3em 0;padding-left:1.2em}
.yt{display:flex;flex-direction:column;gap:6px}
.yt a{display:flex;gap:8px;align-items:center;text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:var(--surface)}
.yt a:hover{border-color:var(--accent)}
.yt a::before{content:"▶";font-size:.7rem;color:#fff;background:#d33;border-radius:5px;padding:3px 6px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.92rem}
.timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:1.4rem}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
#fab{position:fixed;right:20px;bottom:20px;z-index:30;border-radius:99px;padding:12px 18px;box-shadow:0 6px 20px rgba(51,85,224,.35)}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;display:none;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
#drawer.open{display:flex}
#drawer .hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#drawer .bd{flex:1;overflow-y:auto;padding:16px}
#drawer .ft{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}
#drawer .chat{max-height:none}
.levelmap{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:640px){.levelmap{grid-template-columns:repeat(2,1fr)}}
.lvbox{border-radius:14px;padding:14px;color:#10173a;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.lvbox.lvB1,.lvbox.lvB2,.lvbox.lvC1{color:#fff}
.lvbox .bar{background:rgba(0,0,0,.12)} .lvbox .bar>i{background:currentColor}
.hide{display:none!important}
.mic-live{color:var(--muted);font-style:italic}
.sep{height:1px;background:var(--line);margin:6px 0}
.mt{margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){h1{font-size:1.35rem}.wrap{padding:0 16px}.card{padding:16px}.hero{padding:20px}}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="logo" href="#home"><i>Ax</i>Аксон IELTS</a>
  <nav class="main" id="nav"></nav>
  <button class="lvl-pill" id="lvlPill" title="Сменить уровень">B1</button>
</div></header>
<main><div class="wrap" id="app"></div></main>
<button class="btn pri" id="fab">ИИ-ассистент</button>
<aside id="drawer" aria-label="ИИ-ассистент">
  <div class="hd"><h3>ИИ-ассистент</h3><button class="icon" id="drawerClose" aria-label="Закрыть">✕</button></div>
  <div class="bd"><div class="row small" id="quick" style="margin-bottom:12px"></div><div class="chat" id="aChat"></div></div>
  <div class="ft"><input type="text" id="aIn" placeholder="Спросите о грамматике, слове, переводе…"><button class="icon" id="aMic" title="Сказать голосом">🎙</button><button class="btn pri sm" id="aSend">→</button></div>
</aside>
<script>
// GRAMMAR A1–A2. q: [вопрос, [варианты], индекс верного, пояснение]
const GRAMMAR = [
{id:"g-be",lvl:"A1",t:"Глагол to be",yt:"verb to be am is are",
ex:`<p>Глагол <b>to be</b> («быть, являться, находиться») в настоящем времени: <b>I am</b>, <b>he/she/it is</b>, <b>we/you/they are</b>. В русском его часто опускают («Я студентка»), в английском — никогда: <i>I am a student</i>.</p><p>Отрицание: am not / isn't / aren't. Вопрос — переставляем глагол вперёд: <i>Are you tired?</i> Прошедшее: was (I/he/she/it), were (we/you/they).</p>`,
eg:["I am a medical student.","She isn't at home now.","Were they at the lecture yesterday?"],
q:[["My sister ___ a nurse.",["am","is","are"],1,"sister = she → is"],
["We ___ from Russia.",["is","am","are"],2,"we → are"],
["___ you hungry?",["Is","Are","Am"],1,"you → are"],
["I ___ at the hospital yesterday.",["was","were","am"],0,"прошлое, I → was"],
["The patients ___ in ward 3.",["is","are","was"],1,"patients (мн.ч.) → are"],
["He ___ not a doctor, he's a pharmacist.",["are","is","am"],1,"he → is"],
["They ___ late for the exam last week.",["was","were","are"],1,"прошлое, they → were"]]},

{id:"g-ps",lvl:"A1",t:"Present Simple",yt:"present simple tense",
ex:`<p><b>Present Simple</b> — регулярные действия, факты, расписания. Форма: V1, а для <b>he/she/it</b> добавляем <b>-s/-es</b>: <i>she works, he watches, it goes</i>.</p><p>Отрицание и вопрос — через <b>do/does</b>: <i>I don't smoke. Does she work here?</i> После does глагол без -s. Маркеры: always, usually, often, sometimes, never, every day.</p>`,
eg:["The heart pumps blood around the body.","I usually study in the evening.","Does your husband cook?"],
q:[["She ___ in a clinic.",["work","works","working"],1,"she → works"],
["Water ___ at 100°C.",["boil","boils","is boil"],1,"факт, it → boils"],
["___ he speak English?",["Do","Does","Is"],1,"he → does"],
["I ___ coffee in the morning.",["don't drink","doesn't drink","not drink"],0,"I → don't"],
["My son ___ TV every evening.",["watch","watchs","watches"],2,"-ch → -es"],
["The lecture ___ at 9 a.m.",["start","starts","starting"],1,"расписание, it → starts"],
["They ___ live in Moscow.",["doesn't","don't","isn't"],1,"they → don't"],
["Where ___ you usually study?",["do","does","are"],0,"you → do"]]},

{id:"g-art",lvl:"A1",t:"Артикли a / an / the",yt:"articles a an the",
ex:`<p><b>a/an</b> — один из многих, впервые упоминаем: <i>a book, an apple</i> (an — перед гласным <b>звуком</b>: an hour, a university).</p><p><b>the</b> — конкретный, уже известный или единственный: <i>the sun, the doctor I told you about</i>. Без артикля: мн.ч. и неисчисляемые в общем смысле (<i>Doctors work hard. Sugar is bad</i>), названия стран, языки, приёмы пищи.</p>`,
eg:["I saw a patient. The patient had a fever.","She is an honest person.","Blood carries oxygen."],
q:[["I need ___ umbrella.",["a","an","the"],1,"гласный звук → an"],
["She's ___ university student.",["a","an","the"],0,"university звучит как [ju:] → a"],
["Please close ___ door.",["a","an","the"],2,"конкретная дверь → the"],
["___ Moon goes around the Earth.",["A","The","—"],1,"единственный → the"],
["I like ___ music.",["a","the","—"],2,"в общем смысле → без артикля"],
["He waited for ___ hour.",["a","an","the"],1,"hour — h не читается → an"],
["She speaks ___ English.",["the","an","—"],2,"языки — без артикля"]]},

{id:"g-plur",lvl:"A1",t:"Множественное число и исчисляемые",yt:"countable uncountable nouns plural",
ex:`<p>Обычно + <b>-s</b>: doctors. После s, sh, ch, x → <b>-es</b>: boxes. Согласная + y → <b>-ies</b>: babies. Исключения: man–men, woman–women, child–children, tooth–teeth, foot–feet, person–people, mouse–mice.</p><p><b>Неисчисляемые</b> (не имеют мн.ч., не берут a/an): water, information, advice, news, money, furniture, research, equipment.</p>`,
eg:["Children need vaccines.","Can you give me some advice?","The news is good."],
q:[["Two ___ are waiting.",["womans","women","womens"],1,"woman → women"],
["She has three ___.",["babys","babies","baby"],1,"согласная + y → ies"],
["I need some ___.",["informations","information","an information"],1,"неисчисляемое"],
["My ___ hurt after the run.",["foots","feet","feets"],1,"foot → feet"],
["The news ___ shocking.",["are","is","were"],1,"news — ед.ч."],
["He gave me a good piece of ___.",["advice","advices","an advice"],0,"advice неисчисляемое"]]},

{id:"g-there",lvl:"A1",t:"There is / There are",yt:"there is there are",
ex:`<p><b>There is/are</b> — «есть, имеется, находится» (что-то где-то). There is + ед.ч./неисчисляемое; there are + мн.ч. Вопрос: <i>Is there…? Are there…?</i> Отрицание: there isn't any / there aren't any.</p>`,
eg:["There is a pharmacy near my house.","There are 206 bones in the human body.","Is there any milk?"],
q:[["___ a hospital in our town.",["There is","There are","It is"],0,"ед.ч."],
["There ___ many students in the hall.",["is","are","be"],1,"мн.ч."],
["___ any questions?",["Is there","Are there","There are"],1,"вопрос, мн.ч."],
["There ___ any sugar left.",["isn't","aren't","not"],0,"sugar неисчисляемое"],
["There ___ two beds in the ward.",["is","are","has"],1,"мн.ч."]]},

{id:"g-poss",lvl:"A1",t:"Притяжательные: my, mine, 's",yt:"possessive adjectives pronouns apostrophe s",
ex:`<p>Перед существительным: <b>my, your, his, her, its, our, their</b>. Без существительного: <b>mine, yours, his, hers, ours, theirs</b>. Владение людьми: <b>'s</b> — <i>Anna's bag, the doctors' room</i> (мн.ч. на -s → только апостроф).</p><p>Не путать <b>its</b> (его/её — о предмете) и <b>it's</b> (= it is).</p>`,
eg:["This is my notebook. That one is yours.","Maxim's car is red.","The dog wagged its tail."],
q:[["Is this pen ___?",["your","yours","you"],1,"без существительного → yours"],
["This is ___ son.",["our","ours","us"],0,"перед существительным → our"],
["The cat hurt ___ paw.",["it's","its","it"],1,"its = его (о животном)"],
["That's ___ laptop.",["Alsu","Alsu's","Alsus"],1,"владение → 's"],
["The book is ___.",["her","hers","she"],1,"без существительного → hers"]]},

{id:"g-can",lvl:"A1",t:"Can / could",yt:"can could ability",
ex:`<p><b>Can</b> — умение, возможность, разрешение. После can — глагол без to: <i>I can swim</i>. Прошедшее: <b>could</b>. Вежливая просьба: <i>Could you help me?</i> Отрицание: can't / couldn't.</p>`,
eg:["Can you speak English?","I couldn't sleep last night.","Could you repeat the question, please?"],
q:[["She ___ play the piano.",["can","cans","can to"],0,"can без изменений"],
["I can ___ French a little.",["speak","to speak","speaking"],0,"после can — без to"],
["When I was five, I ___ read.",["can","could","can't to"],1,"прошлое → could"],
["___ you open the window, please?",["Could","Must","Should"],0,"вежливая просьба"],
["He ___ come yesterday, he was ill.",["can't","couldn't","not could"],1,"прошлое отрицание"]]},

{id:"g-prep",lvl:"A1",t:"Предлоги места и времени (in, on, at)",yt:"prepositions in on at time place",
ex:`<p><b>Время:</b> at + час, праздник, night (<i>at 5 o'clock, at Christmas</i>); on + день, дата (<i>on Monday, on 24 October</i>); in + месяц, год, время года, части суток (<i>in May, in 2026, in the morning</i>).</p><p><b>Место:</b> at — точка (<i>at the bus stop, at work</i>); on — поверхность (<i>on the table</i>); in — внутри (<i>in the room, in Moscow</i>).</p>`,
eg:["My birthday is on 24 October.","The lecture is at 10 a.m.","She lives in Nizhny Novgorod."],
q:[["I was born ___ 2001.",["at","on","in"],2,"год → in"],
["See you ___ Friday.",["at","on","in"],1,"день недели → on"],
["The meeting is ___ 3 p.m.",["at","on","in"],0,"время → at"],
["He's ___ work now.",["in","on","at"],2,"at work — устойчиво"],
["I study best ___ the evening.",["at","in","on"],1,"in the evening"],

{id:"g-pc",lvl:"A2",t:"Present Continuous vs Present Simple",yt:"present continuous vs present simple",
ex:`<p><b>Present Continuous</b> (am/is/are + V-ing) — действие сейчас или временное: <i>I'm studying now. She's working in Kazan this month.</i> Также планы на ближайшее будущее: <i>I'm meeting him tomorrow.</i></p><p><b>Present Simple</b> — регулярное, постоянное. Глаголы состояния (know, like, want, need, believe, understand, seem) в Continuous обычно не используются: <i>I know</i>, не <s>I'm knowing</s>.</p>`,

["We ___ a new topic this week.",["study","are studying","studies"],1,"временное → Continuous"],
["Water ___ at 0°C.",["is freezing","freezes","freeze"],1,"факт → Simple"],
["What ___ you ___ tonight?",["do / do","are / doing","does / do"],1,"план → Continuous"],

{id:"g-past",lvl:"A2",t:"Past Simple",yt:"past simple regular irregular verbs",
ex:`<p><b>Past Simple</b> — завершённое действие в прошлом с указанием времени (yesterday, last week, in 2020, ago). Правильные глаголы + <b>-ed</b>: worked, studied, stopped. Неправильные — 2-я форма: go–went, see–saw, take–took, have–had.</p><p>Отрицание/вопрос — через <b>did</b> + V1: <i>I didn't go. Did you see him?</i></p>`,

["She ___ the test two days ago.",["take","took","taked"],1,"take → took"],
["___ you see the doctor yesterday?",["Do","Did","Were"],1,"вопрос в прошлом → did"],
["I didn't ___ the answer.",["knew","know","known"],1,"после didn't → V1"],
["He ___ medicine for six years.",["studyed","studied","studies"],1,"y → ied"],
["The bus ___ suddenly.",["stoped","stopped","stop"],1,"удвоение согласной"],

{id:"g-fut",lvl:"A2",t:"Будущее: will / be going to",yt:"will vs going to future",
ex:`<p><b>will</b> — спонтанное решение, обещание, предсказание-мнение: <i>I'll help you. I think it will rain.</i></p><p><b>be going to</b> — заранее принятое решение, план; предсказание по очевидным признакам: <i>I'm going to apply for IELTS. Look at those clouds — it's going to rain.</i></p>`,

{id:"g-comp",lvl:"A2",t:"Сравнительная и превосходная степень",yt:"comparatives superlatives",
ex:`<p>Короткие прилагательные: <b>-er / the -est</b> (big → bigger → the biggest; easy → easier → the easiest). Длинные: <b>more / the most</b> (more important, the most dangerous). Неправильные: good–better–the best, bad–worse–the worst, far–further–the furthest.</p><p>Конструкции: <i>as … as</i> (так же, как), <i>not as … as</i>, <i>the more…, the better</i>.</p>`,

{id:"g-quant",lvl:"A2",t:"some / any / much / many / a lot of",yt:"some any much many a lot of",
ex:`<p><b>some</b> — в утверждениях и вежливых предложениях; <b>any</b> — в вопросах и отрицаниях. <b>many</b> — с исчисляемыми (many patients), <b>much</b> — с неисчисляемыми (much time), чаще в вопросах/отрицаниях. <b>a lot of</b> — с любыми в утверждениях. <b>a few</b> (немного, исчисл.) / <b>a little</b> (немного, неисчисл.); <b>few/little</b> без a — «мало» (негативно).</p>`,

{id:"g-ppintro",lvl:"A2",t:"Present Perfect: введение",yt:"present perfect simple explained",
ex:`<p><b>Present Perfect</b> (have/has + V3) — связь прошлого с настоящим: опыт (<i>I have been to London</i>), результат сейчас (<i>I've lost my keys</i>), недавние новости. Время <b>не указывается</b>. Маркеры: ever, never, already, yet, just, recently.</p><p>V3 правильных = -ed; неправильные — 3-я форма: go–gone/been, see–seen, write–written.</p>`,
eg:["Have you ever been to England?","I've just finished my essay.","She hasn't called yet."],

{id:"g-modal1",lvl:"A2",t:"must / have to / should",yt:"must have to should modal verbs",
ex:`<p><b>must</b> — внутренняя необходимость или правило: <i>I must study harder.</i> <b>have to</b> — внешняя необходимость, обстоятельства: <i>Nurses have to work at night.</i> <b>mustn't</b> = нельзя; <b>don't have to</b> = не обязательно. <b>should</b> — совет: <i>You should see a doctor.</i></p>`,
eg:["You mustn't smoke in the hospital.","You don't have to come, it's optional.","You should drink more water."],

["In Russia, students ___ wear a gown in the lab.",["has to","have to","must to"],1,"внешнее правило, students → have to"],

{id:"g-freq",lvl:"A2",t:"Наречия частотности и их место",yt:"adverbs of frequency position",
ex:`<p>always (100%) – usually – often – sometimes – rarely – never (0%). Место: <b>перед</b> смысловым глаголом (<i>I usually get up at 7</i>), но <b>после</b> to be (<i>She is always late</i>) и после вспомогательного (<i>I have never seen it</i>).</p>`,

{id:"g-ppc",lvl:"B1",t:"Present Perfect Continuous",yt:"present perfect continuous",

{id:"g-cond012",lvl:"B1",t:"Условные предложения 0, 1, 2",yt:"zero first second conditional",
ex:`<p><b>0:</b> If + Present, Present — факты: <i>If you heat ice, it melts.</i></p><p><b>1:</b> If + Present, will + V — реальное будущее: <i>If I study, I will pass.</i> После if/when/unless/as soon as <b>не ставим will</b>.</p><p><b>2:</b> If + Past, would + V — нереальное настоящее/будущее: <i>If I had more time, I would travel.</i> If I/he/she <b>were</b> — норма.</p>`,

{id:"g-rel",lvl:"B1",t:"Относительные придаточные (who, which, that, whose, where)",yt:"relative clauses who which that",
ex:`<p><b>who</b> — люди; <b>which</b> — предметы; <b>that</b> — и то и другое (только в определяющих); <b>whose</b> — чей; <b>where</b> — где; <b>when</b> — когда.</p><p><b>Определяющие</b> (без запятых) — нужны для смысла: <i>The doctor who treated me was kind.</i> <b>Неопределяющие</b> (с запятыми) — доп. информация, that нельзя: <i>My mother, who is a teacher, lives in Ufa.</i></p>`,

["We ___ lost if we had taken a map.",["wouldn't have got","won't get","didn't get"],0,"3 тип, отрицание"],
["If he weren't so shy, he ___ to her at the party.",["would speak","would have spoken","spoke"],1,"смешанный: результат в прошлом"]]},

{id:"g-passive2",lvl:"B2",t:"Пассив: сложные формы",yt:"advanced passive it is said that",
ex:`<p><b>Безличный пассив</b> — must-have для IELTS Writing: <i>It is said/believed/thought/reported that…</i> или <i>He is said to be…/to have been…</i></p><p>Пассив с двумя дополнениями: <i>I was given a prescription.</i> Пассив с инфинитивом/герундием: <i>I want to be informed. I hate being interrupted.</i> Continuous: <i>The ward is being cleaned.</i></p>`,
eg:["It is widely believed that exercise reduces stress.","The drug is thought to have side effects.","The patient is being prepared for surgery."],
q:[["It ___ that the economy will grow.",["expects","is expected","is expecting"],1,"безличный пассив"],
["She is said ___ the best surgeon in the city.",["is","to be","being"],1,"is said to be"],
["The road ___ repaired at the moment.",["is being","is been","has being"],0,"Present Continuous passive"],
["I don't like ___ what to do.",["being told","to tell","telling"],0,"пассивный герундий"],
["He is believed ___ the country last year.",["to leave","to have left","leaving"],1,"прошлое → to have V3"],
["We ___ a lot of homework yesterday.",["gave","were given","were giving"],1,"пассив с двумя дополнениями"]]},

{id:"g-wish",lvl:"B2",t:"wish / if only / I'd rather",yt:"wish if only would rather",
ex:`<p>Сожаление о настоящем: <b>wish + Past</b> — <i>I wish I had more time.</i> О прошлом: <b>wish + Past Perfect</b> — <i>I wish I had studied harder.</i> Раздражение/желание изменений от других: <b>wish + would</b> — <i>I wish you would stop.</i> <b>If only</b> — то же, но эмоциональнее.</p><p><b>I'd rather + V</b> (предпочитаю), <b>I'd rather you + Past</b> (хочу, чтобы ты…). <b>It's time + Past</b>: <i>It's time we left.</i></p>`,
eg:["I wish I spoke English fluently.","If only I hadn't said that!","I'd rather you didn't smoke here."],
q:[["I wish I ___ taller.",["am","were","will be"],1,"настоящее → Past"],
["I wish I ___ that comment yesterday.",["didn't make","hadn't made","wouldn't make"],1,"прошлое → Past Perfect"],
["I wish my neighbours ___ so noisy every night.",["wouldn't be","aren't","won't be"],0,"раздражение → would"],
["It's time we ___ home.",["go","went","will go"],1,"It's time + Past"],
["I'd rather ___ at home tonight.",["stay","to stay","stayed"],0,"I'd rather + V"]]},

{id:"g-futadv",lvl:"B2",t:"Future Continuous и Future Perfect",yt:"future continuous future perfect",
ex:`<p><b>Future Continuous</b> (will be + V-ing) — процесс в момент в будущем: <i>This time tomorrow I'll be taking the exam.</i></p><p><b>Future Perfect</b> (will have + V3) — завершится к моменту в будущем: <i>By June I will have finished the course.</i> Маркер: <b>by</b> + время.</p>`,
eg:["At 10 a.m. I'll be sitting in the exam room.","By 2028, she will have graduated.","Will you be using the laptop tonight?"],
q:[["This time next week I ___ on a beach.",["will lie","will be lying","will have lain"],1,"процесс в будущем"],
["By the end of the year, I ___ 1000 words.",["will learn","will have learned","will be learning"],1,"by → Future Perfect"],
["Don't call at 8 — we ___ dinner.",["will be having","will have had","have"],0,"процесс в момент"],
["By the time you arrive, I ___ the report.",["will finish","will have finished","finish"],1,"завершится к моменту"]]},

{id:"g-caus",lvl:"B2",t:"Каузатив: have / get something done",yt:"causative have something done",
ex:`<p><b>have/get + объект + V3</b> — кто-то делает это для нас: <i>I had my blood tested. She got her hair cut.</i> Также о неприятностях: <i>He had his phone stolen.</i></p><p>Активный вариант: <b>have someone do</b> / <b>get someone to do</b>: <i>I had the nurse check it. I got my husband to cook.</i></p>`,
eg:["I'm having my eyes checked tomorrow.","We need to get the car repaired.","She had her wisdom tooth removed."],
q:[["I ___ my teeth cleaned every six months.",["have","make","do"],0,"have smth done"],
["She got her essay ___ by a tutor.",["check","checked","checking"],1,"V3"],
["He had his wallet ___ on the metro.",["stolen","stole","steal"],0,"неприятность, V3"],
["I got my friend ___ me with the move.",["help","to help","helped"],1,"get someone to do"],
["We are having a new kitchen ___.",["install","installed","installing"],1,"V3"]]},

{id:"g-linkers",lvl:"B2",t:"Связки для Writing (cohesion)",yt:"linking words ielts writing cohesion",
ex:`<p>Связность (Coherence & Cohesion) — 25% оценки Writing. <b>Добавление:</b> moreover, furthermore, in addition. <b>Контраст:</b> however, nevertheless, whereas, although, despite + сущ./V-ing. <b>Причина/следствие:</b> because of, due to, therefore, as a result, consequently. <b>Пример:</b> for instance, such as. <b>Вывод:</b> in conclusion, overall.</p><p>Важно: <i>Although it rained, …</i> (+ предложение) vs <i>Despite the rain, …</i> (+ существительное). However — в начале предложения с запятой.</p>`,
eg:["Although exercise is beneficial, many people avoid it.","Despite having a cold, she went to work.","Smoking damages the lungs. Moreover, it increases the risk of heart disease."],
q:[["___ the heavy traffic, we arrived on time.",["Although","Despite","However"],1,"+ существительное → despite"],
["___ she was tired, she kept studying.",["Despite","Although","In spite"],1,"+ предложение → although"],
["Fast food is cheap. ___, it is often unhealthy.",["However","Although","Despite"],0,"контраст, новое предложение"],
["He didn't revise; ___, he failed.",["moreover","as a result","for instance"],1,"следствие"],
["Some people prefer cities, ___ others like the countryside.",["whereas","despite","therefore"],0,"противопоставление"],
["Many diseases, ___ diabetes, are linked to diet.",["such as","moreover","although"],0,"пример"]]},

{id:"g-artadv",lvl:"B2",t:"Артикли: продвинутые случаи",yt:"advanced articles rules",
ex:`<p><b>the</b> + прилагательное = группа людей: the elderly, the poor, the unemployed. <b>the</b> + инструменты, изобретения в общем: <i>The smartphone has changed our lives.</i> Без артикля: school, hospital, prison, church — в их основной функции (<i>He's in hospital</i> — лечится; <i>She went to the hospital to visit him</i>).</p><p>Реки, моря, океаны, горные цепи — the; одиночные горы, озёра — без артикля. <i>The government, the public, the environment</i> — с the.</p>`,
eg:["The elderly need more medical care.","My son is at school.","Governments should protect the environment."],
q:[["The government should help ___ unemployed.",["—","the","an"],1,"группа людей → the"],
["He was taken to ___ hospital after the accident.",["—","a","the"],0,"как пациент — без артикля (брит.)"],
["___ Volga is the longest river in Europe.",["—","The","A"],1,"реки → the"],
["___ Internet has transformed education.",["—","An","The"],2,"изобретение → the"],
["We must protect ___ environment.",["—","the","an"],1,"the environment"]]},

{id:"g-partcl",lvl:"B2",t:"Причастные обороты",yt:"participle clauses",
ex:`<p>Сокращают предложение и делают стиль выше. <b>V-ing</b> — одновременное/активное: <i>Feeling tired, she went to bed.</i> <b>Having + V3</b> — предшествующее: <i>Having finished the exam, I went home.</i> <b>V3</b> — пассивное: <i>Built in 1900, the hospital is still in use.</i></p><p>Подлежащее оборота и главного предложения должно совпадать!</p>`,
eg:["Walking to the clinic, I met my professor.","Having read the instructions, she started the test.","The patients treated with the new drug recovered faster."],
q:[["___ the results, the doctor called the patient.",["Having received","Received","Receive"],0,"сначала получил"],
["___ in 1755, Moscow University is the oldest in Russia.",["Founding","Founded","Having founded"],1,"пассив → V3"],
["___ for the bus, I read my notes.",["Waited","Waiting","Having waited"],1,"одновременно"],
["Students ___ in the dorm pay less.",["living","lived","have lived"],0,"которые живут"]]},

{id:"g-quantadv",lvl:"B2",t:"Квантификаторы: both, either, neither, each, every",yt:"both either neither all none",
ex:`<p><b>both</b> — оба; <b>either</b> — любой из двух/тоже (в отриц.); <b>neither</b> — ни один из двух. <i>Neither of the drugs works.</i> <b>each</b> — каждый по отдельности; <b>every</b> — все вместе (каждый). <b>none of</b> — ни один (из многих). <b>all/most/some of the…</b></p>`,
eg:["Both my parents are doctors.","Neither answer is correct.","None of the students failed."],
q:[["___ of my sisters is married. Both are single.",["Neither","Either","Both"],0,"ни одна из двух"],
["You can take ___ road — both go to the city.",["neither","either","none"],1,"любая из двух"],
["___ student received a certificate.",["Every","All","Both"],0,"every + ед.ч."],
["___ of the twenty patients had side effects.",["Neither","None","Either"],1,"из многих → none"],
["I don't like coffee, and she doesn't ___.",["too","either","neither"],1,"тоже (отриц.) → either"]]},

{id:"g-narr",lvl:"B2",t:"Повествовательные времена (Speaking Part 2)",yt:"narrative tenses storytelling",
ex:`<p>Для рассказа о прошлом в Speaking Part 2 комбинируйте: <b>Past Simple</b> — основные события; <b>Past Continuous</b> — фон; <b>Past Perfect</b> — то, что было раньше; <b>used to/would</b> — прошлые привычки. Это показывает экзаменатору диапазон грамматики (Grammatical Range).</p>`,
eg:["It was raining and I was walking home when I saw an old friend.","I hadn't seen her since school, so I was really surprised.","When I was a child, we would spend every summer at my grandmother's."],
q:[["The sun ___ and birds were singing when I woke up.",["shone","was shining","had shone"],1,"фон"],
["I recognised him at once although I ___ him for years.",["didn't see","hadn't seen","wasn't seeing"],1,"раньше → Past Perfect"],
["Every summer we ___ go fishing with Dad.",["would","will","were"],0,"привычка в прошлом → would"],
["While I ___ for the bus, I got a call.",["waited","was waiting","had waited"],1,"фон"]]},

{id:"g-inv",lvl:"C1",t:"Инверсия",yt:"inversion advanced grammar",
ex:`<p>После отрицательных/ограничительных наречий в начале предложения порядок как в вопросе — для выразительности и формального стиля: <i>Never have I seen…, Rarely does…, Not only … but also, Hardly had … when, No sooner had … than, Only then did…, Under no circumstances should…</i></p><p>Условные без if: <i>Had I known… (= If I had known), Should you need help… , Were I you…</i></p>`,
eg:["Not only does smoking damage the lungs, but it also harms the heart.","Had I known about the side effects, I wouldn't have taken it.","Under no circumstances should you stop the treatment early."],
q:[["Never ___ such a complex case.",["I have seen","have I seen","I saw"],1,"инверсия"],
["Not only ___ late, but he also forgot his notes.",["he was","was he","he is"],1,"Not only + инверсия"],
["___ I known, I would have helped.",["Had","If","Have"],0,"Had I known = If I had known"],
["No sooner ___ arrived than it started to rain.",["we had","had we","we have"],1,"No sooner had…"],
["Should you ___ any questions, call us.",["have","had","having"],0,"Should you + V"],
["Rarely ___ patients complain about this clinic.",["do","are","have"],0,"Rarely do + V"]]},

{id:"g-cleft",lvl:"C1",t:"Расщеплённые предложения (cleft)",yt:"cleft sentences it is what",
ex:`<p>Выделяют главное: <b>It is/was … that/who…</b> — <i>It was the nurse who noticed the symptoms.</i> <b>What … is/was…</b> — <i>What I need is more practice.</i> <b>All I want is…</b>, <b>The reason why… is that…</b></p><p>Отличный приём для Speaking: звучит естественно и показывает C1.</p>`,
eg:["What surprised me most was the cost of treatment.","It's speaking that I find the most difficult.","The thing I love about medicine is helping people."],
q:[["___ I really need is a holiday.",["That","What","Which"],1,"What … is"],
["It was my mother ___ inspired me to study medicine.",["who","what","which"],0,"It was … who"],
["___ was in 2020 that I decided to change careers.",["What","It","There"],1,"It was … that"],
["All I want ___ to pass IELTS.",["are","is","be"],1,"All I want is"]]},

{id:"g-nomin",lvl:"C1",t:"Номинализация (академический стиль)",yt:"nominalisation academic writing",
ex:`<p>Глагол/прилагательное → существительное: делает текст формальным и плотным, что ценится в Writing Task 2. <i>The government reduced taxes, which helped the economy</i> → <i>The reduction in taxes benefited the economy.</i></p><p>Типичные: increase → an increase in; decide → a decision; fail → failure; important → importance; able → ability; develop → development; treat → treatment; diagnose → diagnosis.</p>`,
eg:["The rapid growth of cities has led to pollution.","The introduction of vaccines resulted in a decline in mortality.","There has been a significant improvement in healthcare."],
q:[["Choose the nominalised version of 'Prices rose sharply':",["There was a sharp rise in prices.","Prices were rising sharp.","Prices sharply rose up."],0,"rise (сущ.)"],
["The ___ of the disease was difficult. (diagnose)",["diagnose","diagnosis","diagnosed"],1,"diagnose → diagnosis"],
["The ___ of new technology changed medicine. (develop)",["developing","development","developed"],1,"develop → development"],
["Lack of sleep causes a ___ in concentration. (decrease)",["decrease","decreasing","decreased"],0,"a decrease in"],
["The ___ of exercise cannot be overstated. (important)",["important","importance","importantly"],1,"important → importance"]]},

{id:"g-hedge",lvl:"C1",t:"Хеджирование (осторожные утверждения)",yt:"hedging language academic",
ex:`<p>Академический английский избегает категоричности. Средства: модальные (<i>may, might, could</i>), глаголы (<i>appear, seem, tend to, suggest, indicate</i>), наречия (<i>arguably, generally, possibly, to some extent</i>), конструкции (<i>It could be argued that…, There is evidence to suggest…</i>).</p>`,
eg:["Regular exercise may reduce the risk of depression.","It could be argued that technology isolates people.","The results suggest that the drug is effective."],
q:[["Which sentence is hedged?",["Sugar causes diabetes.","Sugar may contribute to diabetes.","Sugar always leads to diabetes."],1,"may contribute"],
["Young people ___ to spend more time online.",["tend","are tend","tends"],0,"tend to"],
["___ be argued that cities are healthier.",["It could","It is","There could"],0,"It could be argued"],
["The data ___ that the treatment works.",["prove absolutely","suggest","shows definitely"],1,"suggest — осторожно"]]},

{id:"g-modadv",lvl:"C1",t:"Модальные с перфектом: should have, needn't have",yt:"should have could have needn't have",
ex:`<p><b>should have + V3</b> — следовало (но не сделал): <i>You should have told me.</i> <b>could have</b> — мог бы (но не сделал): <i>I could have died!</i> <b>needn't have</b> — сделал, но было не нужно: <i>You needn't have bought flowers.</i> Сравни: <b>didn't need to</b> — не было нужно (и, скорее всего, не делал).</p>`,
eg:["I should have revised more for the test.","He could have become a surgeon, but he chose research.","You needn't have come so early — the exam starts at 11."],
q:[["I failed. I ___ more.",["should study","should have studied","must study"],1,"сожаление"],
["We ___ a taxi — the station was close, but we did.",["needn't have taken","didn't need take","mustn't take"],0,"сделали зря"],
["You ___ hurt! Be careful.",["could have been","could be have","can have been"],0,"мог бы"],
["She ___ me — I already knew.",["needn't have told","mustn't have told","shouldn't tell"],0,"не было нужды"]]},

{id:"g-subj",lvl:"C1",t:"Сослагательное наклонение (subjunctive)",yt:"subjunctive mood suggest recommend",
ex:`<p>После <b>suggest, recommend, insist, demand, advise, it is essential/vital/important that</b> — глагол в базовой форме без -s (часто в медицине и формальных письмах): <i>The doctor recommended that she <b>rest</b>. It is vital that he <b>be</b> monitored.</i> Британский вариант: should + V.</p>`,
eg:["I suggest that he see a specialist.","It is essential that every patient give consent.","They insisted that the meeting be postponed."],
q:[["The doctor recommended that he ___ smoking.",["stops","stop","stopped"],1,"базовая форма"],
["It is vital that she ___ informed.",["is","be","was"],1,"be"],
["I suggest that you ___ the computer test.",["take","takes","taking"],0,"базовая форма"],
["They demanded that the clinic ___ its prices.",["lowers","lower","lowered"],1,"базовая форма"]]},

{id:"g-ellip",lvl:"C1",t:"Эллипсис и замещение",yt:"ellipsis and substitution english",
ex:`<p>Чтобы не повторяться: <b>so/not</b> (<i>I think so. I hope not.</i>), <b>one/ones</b> (<i>this one</i>), <b>do so</b>, вспомогательные (<i>She can swim and so can I. I haven't finished, but he has.</i>). Это повышает Coherence в Speaking и Writing.</p>`,
eg:["— Will it rain? — I'm afraid so.","I wanted to go, but I couldn't.","She likes the red dress, but I prefer the blue one."],
q:[["— Is the exam today? — I don't think ___.",["it","so","that"],1,"think so"],
["I love coffee and ___ my husband.",["so does","so is","does so"],0,"so does"],
["These shoes are too small. Do you have bigger ___?",["one","ones","them"],1,"ones — мн.ч."],
["— Will you fail? — I hope ___!",["no","not","don't"],1,"hope not"],
["He said he would call, but he didn't ___.",["—","so","it"],0,"эллипсис: didn't (call)"]]}
);

{id:"g-imper",lvl:"A1",t:"Повелительное наклонение",yt:"imperatives english grammar",
ex:`<p>Повелительное = глагол без to и без подлежащего: <i>Sit down. Open your mouth.</i> Отрицание — <b>Don't</b>: <i>Don't eat before the test.</i> Вежливо — с please. <b>Let's</b> + V — предложение сделать вместе.</p>`,
eg:["Take a deep breath.","Don't move, please.","Let's start the exam."],
q:[["___ the window, please.",["Open","Opens","To open"],0,"глагол без изменений"],["___ touch the wound!",["Not","Don't","No"],1,"Don't + V"],["___ go to the cafe.",["Let","Let's","Lets"],1,"Let's + V"],["Please ___ quiet.",["are","be","is"],1,"be quiet"],["___ forget your passport.",["Don't","Doesn't","Not to"],0,"Don't"]]},
{id:"g-objpr",lvl:"A1",t:"Объектные местоимения (me, him, them)",yt:"object pronouns me him her",
ex:`<p>Подлежащее: I, you, he, she, it, we, they. Дополнение (после глагола и предлога): <b>me, you, him, her, it, us, them</b>. <i>The doctor called <b>me</b>. Give it to <b>her</b>.</i></p>`,
eg:["Can you help me?","I like them a lot.","Tell him about the results."],
q:[["Can you call ___ tomorrow?",["I","me","my"],1,"дополнение → me"],["I saw ___ at the hospital. (she)",["she","her","hers"],1,"her"],["This is for ___. (we)",["we","us","our"],1,"после предлога → us"],["Ask ___ about it. (they)",["they","them","their"],1,"them"],["The nurse helped ___. (he)",["he","his","him"],2,"him"]]},
{id:"g-qwords",lvl:"A1",t:"Вопросительные слова и порядок слов в вопросе",yt:"question words wh questions",
ex:`<p><b>What</b> (что), <b>Where</b> (где), <b>When</b> (когда), <b>Why</b> (почему), <b>Who</b> (кто), <b>How</b> (как), <b>How much/many</b> (сколько), <b>How long</b> (как долго), <b>Which</b> (который из). Порядок: <b>Вопрос. слово + вспом. глагол + подлежащее + глагол</b>: <i>Where do you live? What did she say?</i></p>`,
eg:["How long have you had the pain?","Why did you come today?","Which tablet do you take in the morning?"],
q:[["___ do you live? — In Kazan.",["What","Where","When"],1,"место"],["___ old is your son?",["How","What","Which"],0,"How old"],["___ is your teacher? — Mrs Smith.",["Who","What","Whose"],0,"кто"],["Correct question:",["Where you work?","Where do you work?","Where work you?"],1,"вспом. глагол перед подлежащим"],["___ did the pain start? — Yesterday.",["Where","When","Why"],1,"когда"],["___ times a day do you take it?",["How much","How many","How long"],1,"исчисляемое"]]},
{id:"g-this",lvl:"A1",t:"this / that / these / those",yt:"this that these those",
ex:`<p><b>this</b> (этот, близко, ед.ч.), <b>these</b> (эти, близко, мн.ч.), <b>that</b> (тот, далеко), <b>those</b> (те, далеко, мн.ч.).</p>`,
eg:["This pen is mine.","Those people are doctors.","What's that?"],
q:[["___ books here are new.",["This","These","That"],1,"близко, мн.ч."],["Look at ___ bird over there!",["this","that","these"],1,"далеко, ед.ч."],["___ shoes over there are expensive.",["Those","These","That"],0,"далеко, мн.ч."],["Is ___ your bag? (в руках)",["this","those","these"],0,"близко, ед.ч."]]},
{id:"g-havegot",lvl:"A1",t:"have / have got",yt:"have got grammar",
ex:`<p>«У меня есть»: <b>I have</b> или (брит.) <b>I've got</b>. He/she: <b>has / has got</b>. Вопрос: <i>Do you have…? / Have you got…?</i> Отрицание: <i>I don't have / I haven't got</i>.</p>`,
eg:["I've got a son.","She has a headache.","Have you got any allergies?"],
q:[["She ___ two children.",["have","has","have got"],1,"she → has"],["___ you got a pen?",["Do","Have","Has"],1,"Have you got"],["I ___ a car.",["haven't got","hasn't got","don't got"],0,"I haven't got"],["Does he ___ a fever?",["has","have","having"],1,"после does → have"]]},
{id:"g-edIng",lvl:"A2",t:"Прилагательные на -ed и -ing",yt:"ed and ing adjectives",
ex:`<p><b>-ed</b> — что чувствует человек: <i>I'm bored, tired, interested.</i> <b>-ing</b> — что вызывает чувство: <i>The lecture is boring, tiring, interesting.</i></p>`,
eg:["I was confused by the instructions.","The results are surprising.","She felt exhausted after the shift."],
q:[["The film was very ___.",["bored","boring"],1,"вызывает → -ing"],["I'm ___ in anatomy.",["interested","interesting"],0,"чувствую → -ed"],["The news was ___.",["shocked","shocking"],1,"-ing"],["We were ___ after the long journey.",["exhausted","exhausting"],0,"-ed"],["This exercise is ___.",["confused","confusing"],1,"-ing"]]},
{id:"g-tooenough",lvl:"A2",t:"too и enough",yt:"too and enough",
ex:`<p><b>too</b> + прил. — слишком (проблема): <i>too hot, too expensive</i>. <b>прил. + enough</b> — достаточно: <i>old enough</i>. <b>enough + сущ.</b>: <i>enough time</i>. <b>too much/many + сущ.</b>: <i>too much sugar</i>.</p>`,
eg:["The tea is too hot to drink.","He isn't tall enough.","We don't have enough nurses."],
q:[["It's ___ cold to go out.",["too","enough","very much"],0,"слишком"],["She's not old ___ to drive.",["too","enough","so"],1,"прил. + enough"],["I don't have ___ money.",["too","enough","so"],1,"enough + сущ."],["You eat ___ sugar.",["too many","too much","enough too"],1,"неисчисл."],["The room isn't big ___.",["enough","too","so"],0,"big enough"]]},
{id:"g-prepmove",lvl:"A2",t:"Предлоги движения",yt:"prepositions of movement",
ex:`<p><b>into/out of</b> (в/из), <b>onto</b> (на), <b>up/down</b>, <b>across</b> (через, поперёк), <b>through</b> (сквозь), <b>along</b> (вдоль), <b>past</b> (мимо), <b>towards</b> (по направлению к), <b>around</b>.</p>`,
eg:["Walk along the corridor and go through the double doors.","The ambulance drove past the hospital.","She jumped into the pool."],
q:[["Go ___ the bridge to the other side.",["across","into","onto"],0,"через"],["We walked ___ the forest.",["through","across","onto"],0,"сквозь"],["He got ___ the taxi.",["out of","out","off of"],0,"из машины"],["Walk ___ the river.",["along","into","up"],0,"вдоль"],["She ran ___ me.",["towards","into the","onto"],0,"по направлению к"]]},
{id:"g-subjq",lvl:"A2",t:"Вопросы к подлежащему",yt:"subject and object questions",
ex:`<p>Если спрашиваем о <b>подлежащем</b> (Who/What в роли «кто сделал»), вспомогательный do/does/did <b>не нужен</b>: <i>Who called you?</i> (кто позвонил). Сравни вопрос к дополнению: <i>Who did you call?</i> (кому ты позвонил).</p>`,
eg:["Who discovered penicillin?","What happened?","Who did you see at the clinic?"],
q:[["___ wrote this report?",["Who","Who did","Who does"],0,"к подлежащему"],["What ___?",["did happen","happened","does happened"],1,"к подлежащему"],["Who ___ you meet yesterday?",["—","did","does"],1,"к дополнению"],["Which student ___ the prize?",["won","did win","does win"],0,"к подлежащему"]]},
{id:"g-timecl",lvl:"B1",t:"Придаточные времени (when, as soon as, until)",yt:"future time clauses when as soon as",
ex:`<p>После <b>when, as soon as, before, after, until, while, once</b> о будущем используем <b>Present</b>, не will: <i>I'll call you when I <b>arrive</b>.</i> Для завершённости — Present Perfect: <i>Once you <b>have finished</b>, hand in your paper.</i></p>`,
eg:["We'll start as soon as the doctor arrives.","Don't leave until I tell you.","After I graduate, I'll apply for residency."],
q:[["I'll phone you when I ___ home.",["will get","get","got"],1,"Present"],["Wait here until the nurse ___.",["comes","will come","came"],0,"Present"],["As soon as I ___ the results, I'll tell you.",["will receive","receive","received"],1,"Present"],["Once you ___ the form, give it to me.",["have completed","will complete","completed"],0,"Present Perfect"]]},
{id:"g-tags",lvl:"B1",t:"Разделительные вопросы (question tags)",yt:"question tags english",
ex:`<p>Утверждение + короткий вопрос с противоположным знаком: <i>You're tired, <b>aren't you</b>? She doesn't smoke, <b>does she</b>?</i> Особые: <i>I'm late, aren't I? Let's go, shall we?</i> Очень естественно в Speaking.</p>`,
eg:["It's a nice day, isn't it?","You haven't eaten, have you?","He can swim, can't he?"],
q:[["She works here, ___?",["doesn't she","isn't she","don't she"],0,"Present Simple → does"],["They didn't come, ___?",["didn't they","did they","do they"],1,"отриц. → положит."],["You've been there, ___?",["haven't you","didn't you","have you"],0,"have"],["I'm right, ___?",["am not I","aren't I","isn't I"],1,"aren't I"],["Let's begin, ___?",["shall we","will we","do we"],0,"shall we"]]},
{id:"g-sosuch",lvl:"B1",t:"so / such",yt:"so and such",
ex:`<p><b>so</b> + прилагательное/наречие: <i>so tired, so quickly</i>. <b>such (a)</b> + (прил.) + существительное: <i>such a good doctor, such nice people</i>. Результат: <i>It was so hot that we stayed in.</i></p>`,
eg:["She is so kind.","It was such a long day.","He spoke so fast that I couldn't follow."],
q:[["It's ___ a difficult exam.",["so","such","such a"],1,"such a + прил + сущ — здесь уже есть a"],["The lecture was ___ boring.",["so","such","such a"],0,"so + прил."],["They are ___ friendly people.",["so","such","such a"],1,"мн.ч. → such"],["I was ___ tired that I fell asleep.",["such","so","such a"],1,"so … that"]]},
{id:"g-refl",lvl:"B1",t:"Возвратные местоимения",yt:"reflexive pronouns myself",
ex:`<p><b>myself, yourself, himself, herself, itself, ourselves, yourselves, themselves</b> — действие на себя: <i>I cut myself.</i> «Сам»: <i>I did it myself.</i> <b>by myself</b> = в одиночку. Не используются с wash, dress, feel, relax обычно: <i>I feel better</i>.</p>`,
eg:["Help yourself to some tea.","She taught herself English.","Did you hurt yourself?"],
q:[["He burned ___ on the stove.",["him","himself","his"],1,"на себя"],["We did it ___.",["ourself","ourselves","us"],1,"ourselves"],["Enjoy ___! (вы — группа)",["yourself","yourselves","you"],1,"мн.ч."],["I live by ___.",["me","myself","mine"],1,"by myself"]]},
{id:"g-indq",lvl:"B1",t:"Косвенные вопросы (вежливые)",yt:"indirect questions polite english",
ex:`<p>Вежливо: <i>Could you tell me…, Do you know…, I wonder…</i> + <b>прямой порядок слов</b>, без do/does/did: <i>Could you tell me where the pharmacy <b>is</b>?</i> Да/нет — if/whether.</p>`,
eg:["Do you know what time it starts?","Could you tell me how much it costs?","I wonder if the results are ready."],
q:[["Could you tell me where ___?",["is the toilet","the toilet is","does the toilet"],1,"прямой порядок"],["Do you know when ___?",["the bus leaves","does the bus leave","leaves the bus"],0,"без does"],["I wonder ___ he is a doctor.",["if","that","what"],0,"да/нет → if"],["Can you tell me what ___?",["did she say","she said","said she"],1,"прямой порядок"]]},
{id:"g-able",lvl:"B1",t:"could / was able to / managed to",yt:"could was able to managed to",
ex:`<p>Общая способность в прошлом — <b>could</b>: <i>I could read at four.</i> Конкретный успешный случай — <b>was able to / managed to</b>: <i>The surgeons were able to save him.</i> В отрицании couldn't подходит всегда. Будущее — <b>will be able to</b>.</p>`,
eg:["I'll be able to speak fluently soon.","Despite the noise, she managed to sleep.","He couldn't come."],
q:[["After hours of work, they ___ fix the problem.",["could","were able to","can"],1,"конкретный успех"],["When I was young I ___ run fast.",["could","managed","was able"],0,"общая способность"],["You ___ drive after the course.",["will can","will be able to","could to"],1,"будущее"],["She ___ to finish on time.",["could","managed","can"],1,"managed to"]]},
{id:"g-phrasal",lvl:"B1",t:"Фразовые глаголы: грамматика",yt:"phrasal verbs separable inseparable",
ex:`<p>Разделяемые: сущ. можно в середине или в конце (<i>turn off the light / turn the light off</i>), местоимение — <b>только в середине</b> (<i>turn it off</i>). Неразделяемые: <i>look after him, get over a cold, come across</i>. Трёхчастные: <i>look forward to, get on with, run out of</i>.</p>`,
eg:["Please fill in the form. / Fill it in.","She is looking after her son.","We've run out of gloves."],
q:[["Turn ___. (the TV)",["off it","it off","off"],1,"местоимение в середине"],["I'm looking forward ___ you.",["to see","to seeing","seeing"],1,"to + ing"],["He got ___ the flu quickly.",["over","off","on"],0,"get over — выздороветь"],["Please put ___ your coat.",["on","it on on","in"],0,"put on"]]},
{id:"g-futpast",lvl:"B2",t:"Будущее в прошедшем (was going to, would)",yt:"future in the past was going to",
ex:`<p>Планы и ожидания в прошлом: <b>was/were going to</b> (собирался, часто — но не сделал): <i>I was going to call, but I forgot.</i> <b>would</b>: <i>She knew she would pass.</i> <b>was about to</b> — вот-вот собирался.</p>`,
eg:["I was going to study medicine in Moscow.","He said he would be late.","I was about to leave when you called."],
q:[["I ___ visit you, but I got ill.",["will","was going to","am going to"],1,"план не осуществился"],["She thought it ___ rain.",["will","would","is going"],1,"would"],["We ___ to leave when the phone rang.",["were about","was about","are about"],0,"were about to"],["He promised he ___ help.",["would","will","is going"],0,"would"]]},
{id:"g-emph",lvl:"B2",t:"Эмфатические конструкции (do/does, really)",yt:"emphatic do does",
ex:`<p>Усиление утверждения — вспомогательный <b>do/does/did</b> перед глаголом: <i>I <b>do</b> understand. She <b>did</b> call you!</i> Также: <i>the very…, at all, whatsoever, indeed</i>.</p>`,
eg:["I do apologise for the delay.","He did take his medication — I saw him.","There's no evidence whatsoever."],
q:[["I ___ like it! Really!",["do","am","does"],0,"эмфатическое do"],["She ___ tell you, didn't she?",["did","does","do"],0,"прошлое → did"],["He ___ work hard.",["does","do","is"],0,"he → does"],["I have no doubt ___.",["whatsoever","at","indeed so"],0,"no … whatsoever"]]},
{id:"g-relprep",lvl:"B2",t:"Относительные придаточные с предлогами",yt:"relative clauses with prepositions formal",
ex:`<p>Формально: предлог + <b>which/whom</b>: <i>the patient <b>to whom</b> I spoke; the method <b>by which</b> it is measured</i>. Разговорно: предлог в конце: <i>the patient I spoke to</i>. Количественные: <i>most of which, some of whom, none of which</i>.</p>`,
eg:["The ward in which she works is new.","Twenty patients, most of whom were elderly, took part.","This is the doctor I told you about."],
q:[["The person to ___ I spoke was helpful.",["who","whom","which"],1,"после предлога → whom"],["The study, the results of ___ were surprising, was published.",["which","that","whom"],0,"of which"],["We tested five drugs, two of ___ worked.",["them","which","that"],1,"of which"],["The hospital ___ I work is big.",["in which","which in","in that"],0,"in which"]]},
{id:"g-compadv",lvl:"B2",t:"Сравнения: продвинутый уровень",yt:"advanced comparisons far more twice as",
ex:`<p>Усиление: <b>much/far/a lot</b> + сравнит.: <i>far more effective</i>. Малая разница: <i>slightly, a bit</i>. Кратность: <i>twice as … as, three times higher than</i>. <i>by far the best</i>. <i>The …-er, the …-er</i>. Незначительно: <i>not nearly as … as</i>.</p>`,
eg:["The new drug is far more effective.","Mortality is twice as high in smokers.","This is by far the most common cause."],
q:[["This test is ___ easier than the last.",["much","very","more"],0,"much + сравн."],["Women are three times ___ likely to develop it.",["more","most","as"],0,"three times more likely"],["It's ___ the best hospital in the city.",["by far","far","much"],0,"by far the best"],["His English is not nearly ___ good as hers.",["as","so","than"],0,"as … as"]]},
{id:"g-letmake",lvl:"B2",t:"make / let / allow / force + глагол",yt:"make let allow verb patterns",
ex:`<p><b>make sb do</b> (заставить), <b>let sb do</b> (позволить) — без to. <b>allow/permit/force/encourage/advise sb to do</b> — с to. Пассив: <i>He was made <b>to</b> wait.</i></p>`,
eg:["The doctor made me wait for an hour.","My parents let me travel alone.","Patients are encouraged to walk after surgery."],
q:[["The nurse made him ___ the pill.",["take","to take","taking"],0,"make + V"],["They don't allow us ___ phones.",["use","to use","using"],1,"allow + to"],["Let me ___ you.",["help","to help","helping"],0,"let + V"],["He was made ___ the form again.",["fill","to fill","filling"],1,"пассив → to"],["I advise you ___ a specialist.",["see","to see","seeing"],1,"advise + to"]]},
{id:"g-depprep",lvl:"B2",t:"Устойчивые предлоги после слов",yt:"dependent prepositions",
ex:`<p>Нужно запоминать: <i>suffer <b>from</b>, depend <b>on</b>, result <b>in</b> (приводит к), result <b>from</b> (вытекает из), be responsible <b>for</b>, be aware <b>of</b>, be allergic <b>to</b>, be associated <b>with</b>, cope <b>with</b>, consist <b>of</b>, contribute <b>to</b>, die <b>of/from</b>, recover <b>from</b>, be prone <b>to</b></i>.</p>`,
eg:["She suffers from migraines.","Smoking is associated with lung cancer.","He is allergic to penicillin."],
q:[["He is allergic ___ nuts.",["to","with","on"],0,"allergic to"],["Obesity contributes ___ diabetes.",["to","in","for"],0,"contribute to"],["Poor diet can result ___ anaemia.",["from","in","to"],1,"приводит к → result in"],["She recovered ___ the operation.",["after","from","of"],1,"recover from"],["Children are prone ___ ear infections.",["to","for","of"],0,"prone to"],["The test consists ___ four parts.",["from","of","in"],1,"consist of"]]},
{id:"g-repverbs",lvl:"B2",t:"Глаголы для пересказа (advise, deny, admit)",yt:"reporting verbs advise deny admit",
ex:`<p>Вместо said: <b>advise/warn/remind/tell sb to do</b>; <b>suggest/admit/deny/recommend doing</b>; <b>agree/refuse/promise/offer to do</b>; <b>apologise for doing</b>; <b>accuse sb of doing</b>; <b>insist on doing</b>.</p>`,

{id:"g-redrel",lvl:"C1",t:"Сокращённые придаточные (reduced relatives)",yt:"reduced relative clauses",
ex:`<p>Придаточное можно сократить до причастия: <i>The man <s>who is</s> sitting there… → The man sitting there…; The drugs <s>that are</s> used in… → The drugs used in…</i> Именно так написаны клинические виньетки USMLE: <i>a 45-year-old man presenting with chest pain…</i></p>`,
eg:["Patients receiving chemotherapy often feel tired.","The samples collected yesterday were lost.","A woman complaining of headache was admitted."],

);

GRAMMAR.push(
{id:"g-vignette",lvl:"B2",med:1,t:"USMLE: структура клинической виньетки",yt:"how to read usmle question stems",
ex:`<p>Любая виньетка USMLE читается по одной схеме: <b>возраст + пол + «presents to the emergency department / clinic with» + жалоба + длительность</b> → анамнез (<i>history of</i>) → осмотр (<i>Physical examination shows…</i>) → анализы (<i>Laboratory studies show…</i>) → вопрос.</p><p>Грамматика: Present Simple для текущего состояния (<i>His temperature is 38.5°C</i>), Past Simple для событий (<i>She was treated with…</i>), Present Perfect для длительности (<i>He has had a cough for 2 weeks</i>), причастия (<i>presenting with, accompanied by</i>).</p>`,
eg:["A 34-year-old woman comes to the physician because of a 2-week history of fatigue.","Physical examination shows pallor and tachycardia.","Which of the following is the most likely diagnosis?"],
q:[["A 60-year-old man ___ to the emergency department with chest pain.",["presents","presenting","is present"],0,"presents to the ED"],["She ___ a cough for three weeks.",["has had","had had","has"],0,"длительность до сих пор"],["Physical examination ___ jugular venous distension.",["shows","is showing","showed it"],0,"Present Simple"],["He ___ with antibiotics last year.",["was treated","has been treated","treated"],0,"Past passive, время указано"],["Which of the following is the most ___ diagnosis?",["likely","like","likelihood"],0,"most likely"],["…because of a 3-day ___ of fever.",["history","story","time"],0,"a 3-day history of"]]},
{id:"g-casepres",lvl:"B2",med:1,t:"Презентация клинического случая: времена",yt:"how to present a patient case presentation",
ex:`<p><b>HPI</b> (history of present illness) — Past Simple и Present Perfect: <i>The pain began 3 hours ago. She has been vomiting since this morning.</i> <b>PMH/медикаменты/привычки</b> — Present: <i>She takes metformin. He smokes 1 pack/day.</i> <b>Осмотр и план</b> — Present и will/plan to: <i>Vitals are stable. We will start IV fluids.</i></p><p>Порядок: ID → chief complaint → HPI → PMH → medications/allergies → social/family history → exam → assessment → plan.</p>`,
eg:["Mr Brown is a 67-year-old man with a history of hypertension who presents with chest pain.","The pain started at rest and radiates to the left arm.","We plan to obtain an ECG and troponins."],
q:[["The pain ___ two hours ago.",["began","has begun","begins"],0,"время указано"],["She ___ since this morning.",["is vomiting","has been vomiting","vomited"],1,"с утра до сих пор"],["He ___ 20 cigarettes a day.",["smokes","is smoking","smoked"],0,"привычка → Present"],["We ___ start antibiotics.",["will","would","are"],0,"план"],["She is a 45-year-old woman with a history ___ asthma.",["of","about","in"],0,"history of"]]},
{id:"g-medpass",lvl:"B2",med:1,t:"Пассив в медицинских текстах",yt:"passive voice in scientific writing",
ex:`<p>В медицине и науке пассив — норма: важен процесс, а не исполнитель. <i>The patient was admitted. Blood was drawn. The drug is metabolized by the liver. The enzyme is inhibited by…</i> Безличные: <i>It is thought that…, X is believed to…</i></p>`,
eg:["Insulin is secreted by beta cells.","The patient was intubated and transferred to the ICU.","This condition is caused by a deficiency of vitamin B12."],
q:[["Bile ___ by the liver.",["produces","is produced","produced"],1,"пассив"],["The patient ___ to the ICU.",["was transferred","transferred","has transfer"],0,"Past passive"],["The drug ___ by the kidneys.",["excretes","is excreted","excreting"],1,"пассив"],["Scurvy ___ by vitamin C deficiency.",["causes","is caused","caused"],1,"пассив"],["The enzyme ___ by aspirin.",["is irreversibly inhibited","irreversibly inhibits","inhibiting"],0,"пассив с наречием"]]},
{id:"g-superq",lvl:"B2",med:1,t:"Вопросы USMLE: most likely, next best step, EXCEPT",yt:"usmle question types next best step",
ex:`<p>Формулировки, которые нужно понимать мгновенно: <b>Which of the following is the most likely diagnosis / cause / mechanism?</b> — самое вероятное. <b>the most appropriate next step in management</b> — что делать <i>сейчас</i>. <b>the most likely underlying mechanism</b> — механизм. <b>is most likely to…</b> — с наибольшей вероятностью. <b>is LEAST likely</b> / <b>EXCEPT</b> — найти неверное. <b>increased risk for</b> — повышенный риск.</p>`,
eg:["Which of the following is the most appropriate next step in management?","This patient is at increased risk for which of the following?","All of the following are expected findings EXCEPT:"],
q:[["'Next best step in management' asks about…",["следующее действие сейчас","окончательный диагноз","механизм болезни"],0,"что делать сейчас"],["'EXCEPT' questions ask you to choose…",["верный вариант","неверный (исключение)","все верные"],1,"исключение"],["This patient is at increased risk ___ stroke.",["for","to","of having to"],0,"risk for/of"],["'Underlying mechanism' means…",["основной механизм","поверхностный симптом","лечение"],0,"underlying = лежащий в основе"],["Which drug is ___ likely to cause this side effect?",["most","more","much"],0,"most likely"]]},
{id:"g-neg",lvl:"B2",med:1,t:"Отрицание в анамнезе: denies, no history of, unremarkable",yt:"pertinent negatives medical history",
ex:`<p>В виньетках отрицание выражается особыми словами: <b>denies</b> (+ сущ./V-ing) — отрицает: <i>She denies chest pain / smoking.</i> <b>has no history of</b>; <b>is otherwise healthy</b>; <b>unremarkable / within normal limits (WNL)</b> — без особенностей, в норме; <b>non-contributory</b> — не имеет значения; <b>absent</b> — отсутствует (<i>absent reflexes</i>); <b>neither … nor</b>.</p>`,
eg:["He denies fever, chills, or weight loss.","Family history is non-contributory.","The rest of the examination is unremarkable."],
q:[["She denies ___ alcohol.",["drink","drinking","to drink"],1,"deny + ing"],["'Unremarkable' in an exam means…",["без особенностей","не запомнилось","тяжёлое"],0,"норма"],["He has no history ___ heart disease.",["of","about","for"],0,"history of"],["Bowel sounds are ___.",["absent","absence","absently"],0,"прилагательное"],["Laboratory results are within normal ___.",["limits","borders","lines"],0,"WNL"]]},
{id:"g-cause",lvl:"B2",med:1,t:"Причина и следствие в патофизиологии",yt:"cause and effect language academic",
ex:`<p>Причина → следствие: <b>leads to, results in, causes, gives rise to, triggers, contributes to</b>. Следствие ← причина: <b>is due to, results from, is caused by, is secondary to, is attributable to</b>. Условие: <i>If X is inhibited, Y accumulates. Inhibition of X leads to accumulation of Y.</i></p>`,
eg:["Hypothyroidism leads to weight gain.","The anaemia is secondary to chronic blood loss.","Deficiency of this enzyme results in accumulation of glycogen."],
q:[["Vitamin K deficiency ___ bleeding.",["results in","results from","is due to"],0,"причина → следствие"],["His renal failure is secondary ___ diabetes.",["to","of","from"],0,"secondary to"],["Jaundice ___ elevated bilirubin.",["is due to","leads to","causes"],0,"следствие ← причина"],["Smoking ___ lung cancer.",["contributes to","results from","is secondary to"],0,"contribute to"],["If the enzyme ___, substrate accumulates.",["is blocked","blocks","will be blocked"],0,"If + Present passive"]]},
{id:"g-dxmodal",lvl:"C1",med:1,t:"Вероятность в диагнозе: consistent with, suggestive of",yt:"hedging in medical language",
ex:`<p>Врачи формулируют осторожно: <b>consistent with</b> (соответствует), <b>suggestive of / indicative of</b> (указывает на), <b>compatible with</b>, <b>rule out</b> (исключить), <b>cannot be excluded</b>, <b>is likely / unlikely</b>, <b>may represent</b>, <b>raises concern for</b>.</p>`,

{id:"t4",lvl:"B2",med:1,t:"How vaccines work",txt:"Vaccines work by training the immune system to recognise a pathogen without causing the disease. Most vaccines contain a weakened or inactivated form of a virus or bacterium, or just a part of it, such as a protein. When the vaccine is injected, the body produces antibodies and memory cells. If the person is later exposed to the real pathogen, the immune system can respond much faster and more effectively. When a large proportion of the population is vaccinated, the spread of disease slows down, which also protects people who cannot be vaccinated. This is known as herd immunity.",q:[["What do vaccines train?",["The nervous system","The immune system","The digestive system"],1],["What does the body produce after vaccination?",["Hormones","Antibodies and memory cells","Enzymes"],1],["What is herd immunity?",["Immunity in animals","Protection of the population when many are vaccinated","A type of vaccine"],1],["Which may a vaccine contain?",["An inactivated virus","Antibiotics","Vitamins only"],0]],key:["immune system","pathogen","inactivated","antibodies","memory cells","herd immunity"]},
{id:"t5",lvl:"B2",med:0,t:"Urban green spaces",txt:"Research consistently shows that access to parks and green spaces improves both physical and mental health. People who live near parks tend to exercise more and report lower levels of stress. Trees also reduce air pollution and help cool cities during heatwaves. Despite these benefits, green areas are often the first to disappear when cities expand, as land is sold to developers. Urban planners argue that green spaces should be treated as essential infrastructure rather than a luxury.",q:[["What do people near parks report?",["Higher income","Lower stress","More noise"],1],["How do trees help in heatwaves?",["They cool cities","They provide fruit","They block roads"],0],["Why do green areas disappear?",["Land is sold to developers","Trees get ill","People don't like them"],0],["What do planners argue?",["Parks are a luxury","Parks are essential infrastructure","Parks should be private"],1]],key:["access","green spaces","heatwaves","developers","essential infrastructure"]},
{id:"t6",lvl:"C1",med:1,t:"Antibiotic resistance",txt:"Antimicrobial resistance is widely regarded as one of the most serious threats to global health. It occurs when bacteria evolve mechanisms that allow them to survive exposure to drugs that would once have killed them. The overuse and misuse of antibiotics, both in human medicine and in agriculture, have accelerated this process considerably. Patients who fail to complete a course of treatment, or who take antibiotics for viral infections, inadvertently contribute to the problem. Unless new classes of antibiotics are developed and prescribing practices are tightened, routine surgical procedures could become life-threatening once again.",q:[["What is antimicrobial resistance?",["Bacteria surviving drugs","A new vaccine","A viral disease"],0],["Which accelerates it?",["Overuse of antibiotics","Healthy diet","Exercise"],0],["Which patient behaviour contributes?",["Finishing the course","Taking antibiotics for viruses","Washing hands"],1],["What could happen to routine surgery?",["It could become life-threatening","It will be cheaper","It will be faster"],0]],key:["antimicrobial resistance","evolve","overuse","misuse","complete a course","life-threatening"]},
{id:"t7",lvl:"A2",med:1,t:"At the pharmacy",txt:"A woman goes into a pharmacy. She tells the pharmacist that she has a sore throat and a runny nose. The pharmacist asks if she has a fever. She says no, but she feels a bit tired. The pharmacist recommends throat lozenges and a nasal spray. She also tells her to drink lots of warm water and rest. If she doesn't feel better in five days, she should see a doctor.",q:[["What are her symptoms?",["Headache and fever","Sore throat and runny nose","Back pain"],1],["Does she have a fever?",["Yes","No","We don't know"],1],["What does the pharmacist recommend?",["Antibiotics","Lozenges and a nasal spray","Surgery"],1],["When should she see a doctor?",["Today","If not better in five days","Never"],1]],key:["pharmacist","sore throat","runny nose","lozenges","nasal spray","rest"]},
{id:"t8",lvl:"B1",med:0,t:"Learning a language as an adult",txt:"Many adults believe they are too old to learn a new language, but research suggests otherwise. While children may find it easier to develop a perfect accent, adults are often better at understanding grammar rules and using learning strategies. The key factors are regular practice, exposure to the language and motivation. Even fifteen to thirty minutes a day can lead to significant progress over a year, especially if learners combine listening, speaking and reviewing vocabulary.",q:[["What do children do more easily?",["Learn grammar","Develop a perfect accent","Use strategies"],1],["What are adults often better at?",["Understanding grammar rules","Sleeping","Remembering songs"],0],["What can 15–30 minutes a day lead to?",["No change","Significant progress","Boredom"],1],["Name a key factor.",["Expensive courses","Regular practice","Living abroad only"],1]],key:["research suggests","accent","strategies","exposure","motivation","significant progress"]}

// ----- state -----
const DEF={xw:{},level:"B1",placed:null,done:{},srs:{},mistakes:[],days:{},minutes:{},essays:[],speaks:[],quiz:{L:[],R:[]},plan:{},drafts:{},ts:0};
let S=JSON.parse(JSON.stringify(DEF));
const LS="axon-ielts-v1";
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(r));}catch(e){}}
let saveT=null,DB=null,DBDOC=null;
function save(){S.ts=Date.now();try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(()=>{if(DBDOC){DBDOC.set({json:JSON.stringify(S),ts:S.ts}).catch(()=>{});}},1500);}
loadLocal();
function mergeXW(){Object.entries(S.xw||{}).forEach(([id,arr])=>{const t=VOCAB.find(v=>v.id===id);if(!t)return;arr.forEach(w=>{if(!t.words.some(x=>x.en.toLowerCase()===w.en.toLowerCase()))t.words.push(w);});ALLTOPICS[id]&&(ALLTOPICS[id].words=t.words);});}

// ----- capabilities -----
let AI=null,DICT=null,TTS=null;
function cap(name){try{return (window.claude&&window.claude.use)?window.claude.use(name):Promise.resolve(null);}catch(e){return Promise.resolve(null);}}
cap("sample").then(x=>{AI=x;rerenderSoft();});
cap("dictation").then(x=>{DICT=x;if(DICT){DICT.onPartial(({text})=>MIC.partial&&MIC.partial(text));DICT.onFinal(({text})=>MIC.final&&MIC.final(text));DICT.onState(({state})=>{MIC.state=state;MIC.onstate&&MIC.onstate(state);});}rerenderSoft();});
cap("tts").then(x=>{TTS=x;rerenderSoft();});
Promise.all([cap("db"),cap("user")]).then(async([db,user])=>{
  if(!db||!user)return; try{const id=await user.id();DB=db;DBDOC=db.collection("data/users/"+id).doc("state");
    const t=setTimeout(()=>{},10000);const snap=await DBDOC.get();clearTimeout(t);
    const d=snap&&(snap.data?snap.data():snap);
    if(d&&d.json&&d.ts>(S.ts||0)){S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(d.json));try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){};route();}
    else if(S.ts){DBDOC.set({json:JSON.stringify(S),ts:S.ts}).catch(()=>{});}
  }catch(e){}
});
let softT=null;function rerenderSoft(){clearTimeout(softT);softT=setTimeout(()=>{if(!document.activeElement||!/TEXTAREA|INPUT/.test(document.activeElement.tagName))route("cap");},300);}

// ----- speech -----
function say(text,rate){if(!TTS)return;TTS.speak(String(text).slice(0,2000),{language:"en",rate:rate||S.rate||1}).catch(()=>{});}
function sayBtn(text){return TTS?`<button class="icon" title="Озвучить" onclick='say(${JSON.stringify(text)})'>🔊</button>`:"";}
const MIC={state:"idle",partial:null,final:null,onstate:null};
function micStart(onFinal,onPartial,onState){if(!DICT)return false;MIC.final=onFinal;MIC.partial=onPartial;MIC.onstate=onState;
  DICT.start().catch(e=>{if(e&&e.code==="not_granted")toast("Доступ к микрофону не дан — можно печатать ответ.");onState&&onState("idle");});return true;}
function micStop(){if(DICT)return DICT.stop().catch(()=>{});return Promise.resolve();}

// ----- AI helpers -----
function noAI(){return `<div class="notice">ИИ-функции работают, когда платформа открыта в Claude (в браузере или приложении). Сейчас они недоступны.</div>`;}
async function ask(prompt,onText,tier){if(!AI)throw new Error("noai");
  try{const r=await AI(prompt,{onText:onText?({text})=>onText(text):undefined,modelTier:tier||"default"});return r.text;}
  catch(e){if(e&&e.code==="rate_limited")throw new Error("Слишком много запросов — подождите минуту.");if(e&&e.code==="not_granted")throw new Error("Доступ к ИИ не разрешён.");throw e;}}
async function askJSON(prompt,tier){if(!AI)throw new Error("noai");
  const full=prompt+"\n\nReturn ONLY valid JSON, no markdown fences, no commentary.";
  try{if(AI.json){return await AI.json(full,{modelTier:tier||"default"});}}catch(e){if(e&&(e.code==="rate_limited"||e.code==="not_granted"))throw e;}

function md(t){let h=esc(t);
  h=h.replace(/^#{1,4}\s*(.+)$/gm,"<h4>$1</h4>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|\s)\*(\S[^*]*?)\*(?=\s|$|[.,!?])/g,"$1<i>$2</i>");
  h=h.replace(/(^|\n)((?:\s*[-•]\s.+(?:\n|$))+)/g,(m,a,b)=>a+"<ul>"+b.trim().split("\n").map(l=>"<li>"+l.replace(/^\s*[-•]\s/,"")+"</li>").join("")+"</ul>");
  return h.replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>");}

function streak(){let n=0,d=new Date();const has=x=>S.days[x.toISOString().slice(0,10)];if(!has(d))d=new Date(Date.now()-DAY);let miss=0;
  for(let i=0;i<400;i++){if(has(d)){n++;miss=0;}else{miss++;if(miss>1)break;}d=new Date(d-DAY);}return n;}

function srsGrade(k,g){const c=S.srs[k];if(!c)return;if(g<3){c.n=0;c.i=0;c.d=Date.now()+10*60000;}
  else{c.n++;c.i=c.n===1?1:c.n===2?3:Math.round(c.i*c.e*(g===3?0.85:g===5?1.3:1));c.e=Math.max(1.3,c.e+(0.1-(5-g)*(0.08+(5-g)*0.02)));c.d=Date.now()+c.i*DAY;}save();}
function wordByKey(k){const [tid,en]=k.split("::");const t=ALLTOPICS[tid];const w=t&&t.words.find(x=>x.en===en);return w?{...w,tid,tt:t.t}:null;}

// ----- band estimate -----
function estimate(){const base=BAND[S.level];const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const lq=avg(S.quiz.L.slice(-5)),rq=avg(S.quiz.R.slice(-5));
  const fromPct=p=>p==null?null:Math.min(9,Math.max(2,base-1+p*2.5));
  const w=avg(S.essays.slice(-3).map(e=>e.band).filter(Boolean)),s=avg(S.speaks.slice(-3).map(e=>e.band).filter(Boolean));
  const r5=x=>Math.round(x*2)/2;const L=r5(fromPct(lq)??base),R=r5(fromPct(rq)??base),W=r5(w??base-0.5),Sp=r5(s??base);
  return {L,R,W,S:Sp,O:r5((L+R+W+Sp)/4),real:{L:lq!=null,R:rq!=null,W:w!=null,S:s!=null}};}
