let VT="list",VCARD=0,VFLIP=false;
function viewVocabTopic(id){const v=ALLTOPICS[id];const inS=v.words.filter(w=>S.srs[key(id,w.en)]).length;
  return `<div class="crumbs"><a href="#${v.med?"medical":"vocab"}">${v.med?"Медицина":"Лексика"}</a> / ${v.lvl}</div><div class="row between"><h1>${esc(v.t)}</h1><div class="row"><span class="chip lv lv${v.lvl}">${v.lvl}</span>${v.med?'<span class="chip med">медицина</span>':""}</div></div>
  <div class="row mt"><button class="btn pri" onclick="const n=srsAdd('${id}',ALLTOPICS['${id}'].words);toast(n?('Добавлено в повторение: '+n):'Все слова уже в повторении');route(true)">${inS===v.words.length?"Все слова в повторении ✓":"Добавить все слова в повторение"}</button><span class="muted small">${inS}/${v.words.length} в повторении</span></div>
  <div class="grid split mt"><div>
  <div class="card stack" style="margin-bottom:16px"><h3>Режимы тренировки</h3>${modeBar([id],v.t)}<div id="qzbox"></div></div><div class="tabs">${[["list","Список"],["spell","Написание"]].map(([k,n])=>`<button class="${VT===k?"on":""}" onclick="VT='${k}';VCARD=0;VFLIP=false;route(true)">${n}</button>`).join("")}</div>
  <div id="vbody">${vocabBody(id)}</div></div>
  <div class="stack"><div class="card"><h3>Видео по теме</h3>${ytLinks(v.yt,v.med?"med":"v")}</div>
  ${AI?`<div class="card stack"><h3>ИИ-практика</h3><p class="small muted">Расширяйте тему и тренируйтесь в контексте.</p><button class="btn sm" id="mwBtn" onclick="moreWords('${id}')">+20 новых слов по теме</button><button class="btn sm" onclick="vocabStory('${id}')">Текст со словами темы</button>${v.med?`<button class="btn sm" onclick="usmleQ('${id}')">Вопрос-виньетка в стиле USMLE</button>`:""}<div id="vstory"></div></div>`:""}</div></div>`;}
function vocabBody(id){const v=ALLTOPICS[id],W=v.words;
  if(VT==="list")return `<div class="tw"><table class="vtable">${W.map(w=>`<tr><td>${esc(w.en)} ${sayBtn(w.en)}</td><td>${esc(w.ru)}<div class="muted small">${esc(w.ex)} ${w.ex?sayBtn(w.ex):""}</div></td></tr>`).join("")}</table></div>`;
  if(VT==="cards"){const w=W[VCARD%W.length];return `<div class="flash" onclick="VFLIP=!VFLIP;$('#vbody').innerHTML=vocabBody('${id}')"><div>${VFLIP?`${esc(w.ru)}<small>${esc(w.ex)}</small>`:`<b>${esc(w.en)}</b><small>нажмите, чтобы перевернуть</small>`}</div></div>
   <div class="row between mt"><button class="btn" onclick="VCARD=(VCARD-1+${W.length})%${W.length};VFLIP=false;$('#vbody').innerHTML=vocabBody('${id}')">← Назад</button><span class="muted">${VCARD%W.length+1} / ${W.length}</span>${sayBtn(w.en)}<button class="btn" onclick="VCARD++;VFLIP=false;$('#vbody').innerHTML=vocabBody('${id}')">Дальше →</button></div>`;}
  if(VT==="quiz"){const ns="vq-"+id;if(!QS[ns]){const sh=[...W].sort(()=>Math.random()-.5).slice(0,12);QS[ns]=null;
     const list=sh.map(w=>{const others=W.filter(x=>x!==w).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.ru);const o=[w.ru,...others].sort(()=>Math.random()-.5);return [w.en,o,o.indexOf(w.ru),w.ex];});
     const html=quizHTML(ns,list,v.t);QS[ns].onDone=p=>setDone(id,p);return html+`<button class="btn mt" onclick="QS['${ns}']=null;$('#vbody').innerHTML=vocabBody('${id}')">Новый тест</button>`;}
    return quizHTML(ns,QS[ns].list,v.t)+`<button class="btn mt" onclick="QS['${ns}']=null;$('#vbody').innerHTML=vocabBody('${id}')">Новый тест</button>`;}
  if(VT==="spell"){const w=W[VCARD%W.length];return `<div class="card stack"><div class="muted small">Напишите по-английски (${VCARD%W.length+1}/${W.length})</div><div style="font-size:1.3rem">${esc(w.ru)}</div>
   <input type="text" id="spIn" autocomplete="off" placeholder="Ваш ответ" onkeydown="if(event.key==='Enter')spCheck('${id}')"><div class="row"><button class="btn pri" onclick="spCheck('${id}')">Проверить</button><button class="btn" onclick="VCARD++;$('#vbody').innerHTML=vocabBody('${id}')">Пропустить</button></div><div id="spFb"></div></div>`;}
  return "";}
function spCheck(id){const v=ALLTOPICS[id],w=v.words[VCARD%v.words.length];const a=$("#spIn").value.trim().toLowerCase(),r=w.en.toLowerCase().replace(/[.,!?]$/,"");
  const ok=a.replace(/[.,!?]$/,"")===r||r.split(" / ").includes(a);
  $("#spFb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"Верно!":"Правильно: <b>"+esc(w.en)+"</b>"}</div>`;if(!ok)addMistake(w.ru,w.en,v.t);else{setTimeout(()=>{VCARD++;$("#vbody").innerHTML=vocabBody(id);$("#spIn")&&$("#spIn").focus();},700);}say(w.en);}
async function vocabStory(id){const v=ALLTOPICS[id];const box=$("#vstory");box.innerHTML='<span class="muted small">Пишу текст…</span>';
  const words=v.words.slice().sort(()=>Math.random()-.5).slice(0,10).map(w=>w.en).join(", ");
  try{let txt=await ask(`Write a short, natural text (90-130 words, CEFR ${v.lvl}) for an adult Russian learner who studies medicine, using these words/phrases in bold with **: ${words}. Then on a new line write "Вопрос для пересказа:" and one question in English. No title.`,t=>box.innerHTML=`<div class="ai-out small">${md(t)}</div>`,"quick");
    box.innerHTML=`<div class="ai-out small">${md(txt)}</div><div class="row mt">${TTS?`<button class="btn sm" onclick='say(${JSON.stringify(txt.split("Вопрос")[0].replace(/\*/g,""))})'>🔊 Слушать</button>`:""}</div>`;}catch(e){box.innerHTML=`<div class="notice">${esc(e.message==="noai"?"ИИ недоступен":e.message)}</div>`;}}

// ----- flashcards (SRS) -----
let FQ=null,FI=0,FF=false;
VIEWS.flash=()=>{if(!FQ){FQ=srsDue().sort(()=>Math.random()-.5);FI=0;FF=false;}
  if(!Object.keys(S.srs).length)return `<h1>Карточки</h1><div class="card mt"><p>Пока нет слов в повторении. Откройте любую тему в <a href="#vocab">Лексике</a> и нажмите «Добавить все слова в повторение».</p></div>`;
  if(FI>=FQ.length){const nextD=Math.min(...Object.values(S.srs).map(v=>v.d));return `<h1>Карточки</h1><div class="card mt stack"><h2>На сегодня всё ✓</h2><p class="muted">Повторено: ${FQ.length}. Следующие карточки: ${new Date(nextD).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}.</p><div class="row"><a class="btn pri" href="#home" onclick="markPlan('srs')">На главную</a><button class="btn" onclick="FQ=null;route()">Проверить снова</button></div></div>`;}
  const w=wordByKey(FQ[FI]);if(!w){FI++;return VIEWS.flash();}
  return `<h1>Карточки</h1><p class="muted">${FI+1} из ${FQ.length} · интервальное повторение</p>
  <div class="flash mt" onclick="FF=true;route(true)"><div><b>${esc(w.en)}</b>${FF?`<small style="font-size:1.1rem;color:var(--ink)">${esc(w.ru)}</small><small>${esc(w.ex)}</small><small>${esc(w.tt)}</small>`:"<small>вспомните перевод и нажмите</small>"}</div></div>
  <div class="row mt" style="justify-content:center">${sayBtn(w.en)}</div>
  ${FF?`<div class="grid g4 mt">${[[1,"Не помню","bad"],[3,"Трудно",""],[4,"Помню",""],[5,"Легко","good"]].map(([g,n])=>`<button class="btn" style="justify-content:center" onclick="srsGrade(FQ[FI],${g});${g<3?"FQ.push(FQ[FI]);":""}FI++;FF=false;route(true)">${n}</button>`).join("")}</div>`:""}`;};
addEventListener("keydown",e=>{if(curView!=="flash"||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key===" "){e.preventDefault();FF=true;route(true);}});

// ----- placement test -----
let PT={i:0,a:[]};
VIEWS.test=()=>{if(PT.i>=PLACEMENT.length){const sc={};LEVELS.forEach(l=>sc[l]=0);PLACEMENT.forEach((q,i)=>{if(PT.a[i]===q[3])sc[q[0]]++;});
   let lv="A1";for(const l of LEVELS){if(sc[l]>=4)lv=l;else break;}
   return `<h1>Результат теста</h1><div class="card mt stack"><h2>Ваш уровень: ${lv}</h2><div class="grid g4">${LEVELS.map(l=>`<div class="tile"><span class="muted small">${l}</span><span class="num">${sc[l]}/6</span></div>`).join("")}</div>
   <p class="muted small">Уровень засчитывается, если верно 4 из 6 вопросов этого и всех уровней ниже. Тест проверяет грамматику и лексику; навыки уточнятся по мере занятий.</p>
   <div class="row"><button class="btn pri" onclick="S.level='${lv}';S.placed={lv:'${lv}',d:today()};save();PT={i:0,a:[]};location.hash='course'">Установить уровень ${lv}</button><button class="btn" onclick="PT={i:0,a:[]};route()">Пройти заново</button></div></div>`;}
  const q=PLACEMENT[PT.i];return `<h1>Входной тест</h1><p class="muted">Вопрос ${PT.i+1} из ${PLACEMENT.length}. Если не знаете — выберите наугад, это нормально.</p><div class="bar"><i style="width:${PT.i/PLACEMENT.length*100}%"></i></div>
  <div class="card mt"><div style="font-size:1.2rem">${esc(q[1])}</div><div class="opts row mt">${q[2].map((o,j)=>`<button class="opt" onclick="PT.a[PT.i]=${j};PT.i++;route(true)">${esc(o)}</button>`).join("")}</div></div>`;};

async function moreWords(id){const v=ALLTOPICS[id],b=$("#mwBtn");b.disabled=true;b.textContent="ИИ подбирает слова…";
  try{const have=v.words.map(w=>w.en).join("; ");
    const arr=await askJSON(`Topic: "${v.t}" (${v.med?"medical English"+(v.usm?" for USMLE "+v.usm:""):"English for IELTS"}), CEFR ${v.lvl}. Give 20 NEW useful words/phrases for this topic that are NOT in this list: ${have}. For each: English term, Russian translation, one short natural example sentence${v.usm?" in USMLE vignette style":""}. Format: [{"en":"...","ru":"...","ex":"..."}]`,"quick");
    const add=arr.filter(w=>w&&w.en&&w.ru);S.xw[id]=(S.xw[id]||[]).concat(add);mergeXW();save();toast("Добавлено слов: "+add.length);route(true);}
  catch(e){toast("Не получилось: "+e.message);b.disabled=false;b.textContent="+20 новых слов по теме";}}
async function usmleQ(id){const v=ALLTOPICS[id],box=$("#vstory");box.innerHTML='<span class="muted small">Составляю виньетку…</span>';
  try{const o=await askJSON(`Write one USMLE-style ${v.usm&&v.usm.includes("2")?"Step 2 CK":"Step 1"} multiple-choice question related to the topic "${v.t}". Realistic clinical vignette (5-8 sentences: age/sex, presentation, history, exam, labs), question line, 5 options (A-E), one correct. Then an explanation in Russian (why correct, why others wrong) and 5 key English terms from the stem with Russian translations. Format: {"stem":"...","question":"...","o":["...","...","...","...","..."],"c":0,"ru":"...","terms":[["term","перевод"]]}`);
    const ns="uq-"+id+Date.now();box.innerHTML=`<div class="q"><p class="small">${esc(o.stem)}</p><p><b>${esc(o.question)}</b></p></div>`+quizHTML(ns,[[ "Выберите ответ:",o.o,o.c,""]],"USMLE: "+v.t)+`<div id="uqx" class="hide ai-out small mt">${md(o.ru)}<h4>Термины</h4><ul>${(o.terms||[]).map(t=>`<li><b>${esc(t[0])}</b> — ${esc(t[1])}</li>`).join("")}</ul></div>`;
    QS[ns].onDone=()=>$("#uqx").classList.remove("hide");}
  catch(e){box.innerHTML=errBox(e);}}

// ===== VIEWS 2: listening, reading, writing =====
function errBox(e){return `<div class="notice">${esc(e&&e.message==="noai"?"ИИ недоступен в этом окне.":(e&&e.message)||"Ошибка")}</div>`;}
function lvSel(id,val){return `<select id="${id}" style="width:auto">${LEVELS.map(l=>`<option ${l===val?"selected":""}>${l}</option>`).join("")}</select>`;}

// ----- LISTENING -----
let LT=null,LSHOW=false,LMODE="q",GENL=[];
VIEWS.listening=()=>{if(LT!=null)return listenOne();const all=TEXTS.concat(GENL);
  return `<h1>Listening</h1><p class="muted prose">Тексты озвучиваются голосом Claude. Сначала слушайте без текста, отвечайте на вопросы, затем — диктант по предложениям и пересказ голосом.${TTS?"":" Озвучка доступна в Chrome и приложении Claude для компьютера; здесь текст можно читать."}</p>
  ${AI?`<div class="card mt stack"><h3>Новый текст от ИИ</h3><div class="row">${lvSel("glv",S.level)}<select id="gtopic" style="width:auto"><option value="">Любая тема IELTS</option><option>health and medicine</option><option>a doctor-patient conversation</option><option>a university lecture on biology</option><option>work and careers</option><option>environment</option><option>technology</option><option>travel and booking accommodation</option><option>a phone call to book an appointment (IELTS Part 1 style)</option></select><button class="btn pri" id="genL" onclick="genListening()">Создать</button></div></div>`:""}
  <div class="grid g3 mt">${all.map((t,i)=>`<a class="card" href="#listening" onclick="LT=${i};LSHOW=false;LMODE='q';QS['L-'+${i}]=null;route(true);return false"><div class="row between"><span class="chip lv lv${t.lvl}">${t.lvl}</span>${t.med?'<span class="chip med">медицина</span>':""}${t.gen?'<span class="chip">ИИ</span>':""}</div><h3 style="margin-top:10px">${esc(t.t)}</h3><div class="muted small">${t.q.length} вопроса · пересказ</div></a>`).join("")}</div>`;};
function curL(){return TEXTS.concat(GENL)[LT];}
function listenOne(){const t=curL(),ns="L-"+LT;const sents=t.txt.match(/[^.!?]+[.!?]+/g)||[t.txt];
  const qhtml=quizHTML(ns,t.q.map(x=>[x[0],x[1],x[2]]),"Listening: "+t.t);QS[ns].onDone=p=>{S.quiz.L.push(p);save();};
  return `<div class="crumbs"><a href="#listening" onclick="LT=null;route(true);return false">Listening</a> / ${t.lvl}</div><h1>${esc(t.t)}</h1>
  <div class="card mt stack"><div class="row">${TTS?`<button class="btn pri" onclick="say(curL().txt,1)">▶ Слушать</button><button class="btn" onclick="say(curL().txt,0.8)">▶ Медленнее (0.8×)</button><button class="btn" onclick="TTS&&TTS.stop()">■ Стоп</button>`:'<span class="notice">Озвучка недоступна — читайте текст.</span>'}<button class="btn" onclick="LSHOW=!LSHOW;route(true)">${LSHOW||!TTS?"Скрыть текст":"Показать текст"}</button></div>
  ${LSHOW||!TTS?`<div class="prose">${esc(t.txt)}</div>`:""}</div>
  <div class="tabs mt">${[["q","Вопросы"],["d","Диктант"],["r","Пересказ"]].map(([k,n])=>`<button class="${LMODE===k?"on":""}" onclick="LMODE='${k}';route(true)">${n}</button>`).join("")}</div>
  ${LMODE==="q"?qhtml:LMODE==="d"?`<p class="muted small">Слушайте предложение и записывайте его. Затем сравните.</p><div class="stack">${sents.map((s,i)=>`<div class="q"><div class="row">${sayBtn(s.trim())}<input type="text" id="dc${i}" placeholder="Предложение ${i+1}"></div><div id="dcf${i}" class="fb"></div></div>`).join("")}</div><button class="btn pri mt" onclick="checkDict()">Проверить диктант</button>`
  :retellHTML(t)}`;}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();}
function checkDict(){const t=curL();const sents=t.txt.match(/[^.!?]+[.!?]+/g)||[t.txt];let tot=0,ok=0;
  sents.forEach((s,i)=>{const r=norm(s).split(" "),a=norm($("#dc"+i).value).split(" ");const hit=r.filter(w=>a.includes(w)).length;tot+=r.length;ok+=hit;
    $("#dcf"+i).innerHTML=`<span class="${hit/r.length>0.85?"ok":"no"}">${Math.round(hit/r.length*100)}%</span> · <span class="muted">${esc(s.trim())}</span>`;});
  S.quiz.L.push(ok/tot);save();toast("Диктант: "+Math.round(ok/tot*100)+"% слов");}
// recorder widget
let RECBOX=null;
function recBtn(boxId){return DICT?`<button class="btn sm" id="mic-${boxId}" onclick="toggleRec('${boxId}')">🎙 Говорить</button>`:`<span class="muted small">Голосовой ввод доступен в Chrome и приложении Claude для компьютера — можно печатать.</span>`;}
let recStart=0;
function toggleRec(boxId){const btn=$("#mic-"+boxId);if(MIC.state==="listening"&&RECBOX===boxId){micStop();return;}
  if(MIC.state==="listening")micStop();RECBOX=boxId;const box=$("#"+boxId);let base=box.value;recStart=Date.now();
  micStart(f=>{base=(base?base+" ":"")+f;box.value=base;box.dispatchEvent(new Event("input"));},p=>{box.value=(base?base+" ":"")+p;},st=>{const b=$("#mic-"+boxId);if(!b)return;
    if(st==="listening"){b.classList.add("rec");b.textContent="■ Стоп";}else{b.classList.remove("rec");b.textContent="🎙 Говорить";const sec=(Date.now()-recStart)/1000;if(sec>2){S.speakSec=(S.speakSec||0)+sec;save();}}});}
function retellHTML(t){return `<div class="card stack"><p class="muted small">Перескажите текст своими словами (голосом или текстом). Постарайтесь использовать ключевые слова:</p><div class="row">${(t.key||[]).map(k=>`<span class="chip">${esc(k)}</span>`).join("")}</div>
  <textarea id="rt" style="min-height:140px" placeholder="Ваш пересказ…"></textarea><div class="row">${recBtn("rt")}${AI?`<button class="btn pri" id="rtBtn" onclick="checkRetell()">Оценить пересказ</button>`:""}</div><div id="rtOut"></div></div>`;}
async function checkRetell(){const t=curL(),a=$("#rt").value.trim();if(a.split(" ").length<8){toast("Скажите хотя бы пару предложений");return;}
  const used=(t.key||[]).filter(k=>a.toLowerCase().includes(k.toLowerCase().split(" ")[0]));const out=$("#rtOut");$("#rtBtn").disabled=true;
  try{await ask(`You are an IELTS speaking coach. The learner (Russian, CEFR ${S.level}, studying medicine) listened to this text and retold it (the retelling may be a speech-to-text transcript, so ignore punctuation and capitalization).
ORIGINAL: """${t.txt}"""
RETELLING: """${a}"""
Reply in Russian, concise, with headings: ### Содержание (what was covered/missed), ### Ошибки (up to 5 grammar/vocabulary mistakes: wrong → correct), ### Как сказать лучше (a corrected improved version in English, 4-6 sentences, B2 level), ### Оценка (approximate IELTS Speaking band for fluency/lexis/grammar based on the text, one line).`,x=>out.innerHTML=`<div class="ai-out">${md(x)}</div>`);
    out.insertAdjacentHTML("afterbegin",`<p class="small muted">Ключевые слова использованы: ${used.length} из ${(t.key||[]).length}</p>`);markPlan("ear");}catch(e){out.innerHTML=errBox(e);}$("#rtBtn").disabled=false;}
async function genListening(){const b=$("#genL"),lv=$("#glv").value,tp=$("#gtopic").value;b.disabled=true;b.textContent="Создаю…";
  try{const o=await askJSON(`Create an IELTS-style listening text for CEFR ${lv}${tp?`, topic: ${tp}`:""}. ${lv<"B1"?"80-110":"150-220"} words, natural spoken English (monologue or dialogue written as prose). Then 5 multiple-choice comprehension questions with 3 options each, and 5-7 key phrases from the text for retelling. Format: {"t":"title","txt":"...","q":[["question",["a","b","c"],correctIndex]],"key":["..."]}`);
    o.lvl=lv;o.gen=1;o.med=/health|medic|doctor|biology|appointment/.test(tp)?1:0;GENL.push(o);LT=TEXTS.length+GENL.length-1;LSHOW=false;LMODE="q";route(true);}
  catch(e){toast("Не получилось: "+e.message);b.disabled=false;b.textContent="Создать";}}

// ----- READING -----
let RT=null,GENR=[],RANS={};
VIEWS.reading=()=>{if(RT!=null)return readOne();const all=READING.concat(GENR);
  return `<h1>Reading</h1><p class="muted prose">Тексты в формате IELTS General Training: объявления, рабочие документы, статьи. Ответы — True / False / Not Given и пропуски.</p>
  ${AI?`<div class="card mt stack"><h3>Новый текст от ИИ</h3><div class="row">${lvSel("rlv",S.level)}<select id="rsec" style="width:auto"><option value="Section 1 (everyday notice or advertisement)">Section 1 — бытовой текст</option><option value="Section 2 (workplace document: policy, training, job info)">Section 2 — рабочий документ</option><option value="Section 3 (longer general-interest article)">Section 3 — длинная статья</option><option value="Section 3 article on a medical or health topic">Статья о медицине</option></select><button class="btn pri" id="genR" onclick="genReading()">Создать</button></div></div>`:""}
  <div class="grid g3 mt">${all.map((t,i)=>`<a class="card" href="#reading" onclick="RT=${i};RANS={};route(true);return false"><span class="chip lv lv${t.lvl}">${t.lvl}</span> ${t.gen?'<span class="chip">ИИ</span>':""}<h3 style="margin-top:10px">${esc(t.t)}</h3><div class="muted small">${esc(t.type)} · ${t.q.length} вопросов</div></a>`).join("")}</div>
  <div class="card mt"><h3>Стратегия True / False / Not Given</h3><div class="small">${TIPS[2].b}</div></div>`;};
function readOne(){const t=READING.concat(GENR)[RT];
  return `<div class="crumbs"><a href="#reading" onclick="RT=null;route(true);return false">Reading</a> / ${esc(t.type)}</div><h1>${esc(t.t)}</h1>
  <div class="grid g2 mt"><div class="card prose small">${t.txt}</div><div class="stack">${t.q.map((q,i)=>`<div class="q"><div>${i+1}. ${esc(q.s)}</div>
  ${q.type==="tfng"?`<div class="opts">${["TRUE","FALSE","NOT GIVEN"].map(o=>`<button class="opt" id="ro${i}${o[0]}" onclick="RANS[${i}]='${o}';document.querySelectorAll('[id^=ro${i}]').forEach(b=>b.style.outline='');this.style.outline='2px solid var(--accent)'">${o}</button>`).join("")}</div>`
   :`<input type="text" class="mt" oninput="RANS[${i}]=this.value" placeholder="Ответ">`}<div class="fb" id="rf${i}"></div></div>`).join("")}
  <button class="btn pri" onclick="checkReading()">Проверить</button><div id="rRes"></div></div></div>`;}
function checkReading(){const t=READING.concat(GENR)[RT];let ok=0;t.q.forEach((q,i)=>{const a=(RANS[i]||"").trim().toLowerCase(),r=String(q.a).toLowerCase();const good=a===r;if(good)ok++;else addMistake(q.s,q.a,"Reading");
  $("#rf"+i).innerHTML=`<span class="${good?"ok":"no"}">${good?"Верно":"Ответ: "+esc(q.a)}</span>${q.why?` — <span class="muted">${esc(q.why)}</span>`:""}`;$("#rf"+i).className="fb "+(good?"ok":"no");});
  S.quiz.R.push(ok/t.q.length);save();$("#rRes").innerHTML=`<div class="card mt"><b>${ok} из ${t.q.length}</b></div>`;}
async function genReading(){const b=$("#genR");b.disabled=true;b.textContent="Создаю…";const lv=$("#rlv").value,sec=$("#rsec").value;
  try{const o=await askJSON(`Create an IELTS General Training reading task, ${sec}, CEFR ${lv}. Text ${lv<"B2"?"200-280":"320-450"} words, as simple HTML paragraphs (<p>, optional <b>). Then 8 questions: 5 True/False/Not Given (include at least one NOT GIVEN and one FALSE) and 3 gap-fill (answer = 1-2 words or a number taken from the text). Add a short Russian explanation "why" for each. Format: {"t":"title","type":"GT ...","txt":"<p>..</p>","q":[{"type":"tfng","s":"statement","a":"TRUE|FALSE|NOT GIVEN","why":"..."},{"type":"gap","s":"sentence with ___","a":"answer","why":"..."}]}`);
    o.lvl=lv;o.gen=1;GENR.push(o);RT=READING.length+GENR.length-1;RANS={};route(true);}catch(e){toast("Не получилось: "+e.message);b.disabled=false;b.textContent="Создать";}}

let WT="t1",WP=0,WTIMER=null,WLEFT=0;
VIEWS.writing=()=>{const list=WRITING[WT],p=list[WP%list.length],dk=WT+"-"+WP,draft=S.drafts[dk]||"";const need=WT==="t1"?150:250;
  return `<h1>Writing</h1><p class="muted prose">Task 1 — письмо (150+ слов, ≈20 мин). Task 2 — эссе (250+ слов, ≈40 мин; можно писать по частям, черновик сохраняется). ИИ оценивает по 4 критериям IELTS.</p>
  <div class="tabs mt">${[["t1","Task 1 · письмо"],["t2","Task 2 · эссе"]].map(([k,n])=>`<button class="${WT===k?"on":""}" onclick="WT='${k}';WP=0;route(true)">${n}</button>`).join("")}</div>
  <div class="grid split"><div class="stack">

   <textarea id="wtx" placeholder="Начните писать…" oninput="S.drafts['${dk}']=this.value;save();$('#wc').textContent=this.value.trim()?this.value.trim().split(/\\s+/).length:0">${esc(draft)}</textarea>
   <div class="row between"><span><b id="wc">${draft.trim()?draft.trim().split(/\s+/).length:0}</b> <span class="muted">/ ${need} слов</span></span><div class="row"><span class="timer" id="wtm">${WTIMER?fmt(WLEFT):(WT==="t1"?"20:00":"40:00")}</span><button class="btn sm" onclick="wTimer()">${WTIMER?"Стоп":"Таймер"}</button></div></div>
   <div class="row">${AI?`<button class="btn pri" id="wBtn" onclick="checkWriting()">Проверить ИИ</button><button class="btn" onclick="sampleWriting()">Образец ответа на 7.0</button><button class="btn" onclick="planWriting()">Помочь с планом</button>`:noAI()}</div>
   <div id="wOut"></div></div>
   <div class="stack"><div class="card small">${WT==="t1"?TIPS[3].b:TIPS[4].b}</div><a class="card" href="#v-letters"><h3>Фразы для писем →</h3><div class="muted small">Формальные и неформальные шаблоны</div></a><a class="card" href="#g-linkers"><h3>Связки для эссе →</h3><div class="muted small">However, despite, therefore…</div></a>
   ${S.essays.length?`<div class="card"><h3>История оценок</h3><div class="stack small mt">${S.essays.slice(-6).reverse().map(e=>`<div class="row between"><span>${e.d} · ${e.task.toUpperCase()}</span><b>${e.band??"—"}</b></div>`).join("")}</div></div>`:""}</div></div>`;};
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function wTimer(){if(WTIMER){clearInterval(WTIMER);WTIMER=null;route(true);return;}WLEFT=WT==="t1"?1200:2400;WTIMER=setInterval(()=>{WLEFT--;const el=$("#wtm");if(el)el.textContent=fmt(WLEFT);if(WLEFT<=0){clearInterval(WTIMER);WTIMER=null;toast("Время вышло!");}},1000);route(true);}
async function checkWriting(){const txt=$("#wtx").value.trim(),p=WRITING[WT][WP%WRITING[WT].length];if(txt.split(/\s+/).length<40){toast("Напишите хотя бы 40 слов");return;}
  const out=$("#wOut"),b=$("#wBtn");b.disabled=true;b.textContent="Проверяю…";
  try{const r=await ask(`You are a strict, experienced IELTS examiner. Assess this IELTS General Training Writing ${WT==="t1"?"Task 1 (letter, min 150 words)":"Task 2 (essay, min 250 words)"} using the official band descriptors.
TASK: """${p.t}"""
ANSWER (${txt.split(/\s+/).length} words): """${txt}"""
Answer in Russian (keep English examples in English). Structure exactly:
### Оценка
- Task ${WT==="t1"?"Achievement":"Response"}: X
- Coherence & Cohesion: X
- Lexical Resource: X
- Grammatical Range & Accuracy: X
- **Overall: X**
### Что хорошо
(2-3 bullets)
### Главные проблемы
(3-5 bullets, most important first; what stops a higher band)
### Ошибки
(up to 10 bullets: "wrong" → "correct" — short reason)
### Улучшенная версия
(rewrite the answer at band 7.0-7.5, keeping the learner's ideas)
### Что тренировать
(2 concrete exercises / grammar topics)`,x=>out.innerHTML=`<div class="ai-out">${md(x)}</div>`);
    const m=r.match(/Overall[^0-9]*([0-9](?:[.,]5)?)/i);const band=m?parseFloat(m[1].replace(",",".")):null;S.essays.push({d:today(),task:WT,band,words:txt.split(/\s+/).length});markPlan("main");save();}
  catch(e){out.innerHTML=errBox(e);}b.disabled=false;b.textContent="Проверить ИИ";}
async function sampleWriting(){const p=WRITING[WT][WP%WRITING[WT].length],out=$("#wOut");
  try{await ask(`Write a model band 7.0 answer for this IELTS General Training ${WT==="t1"?"Task 1 letter (about 170 words)":"Task 2 essay (about 270 words)"}: """${p.t}""". After the answer, add in Russian a short list "### Полезные фразы" with 8 useful phrases from the answer and their translations.`,x=>out.innerHTML=`<div class="ai-out">${md(x)}</div>`);}catch(e){out.innerHTML=errBox(e);}}
async function planWriting(){const p=WRITING[WT][WP%WRITING[WT].length],out=$("#wOut");
  try{await ask(`Help a B1-B2 learner plan (not write) an answer to this IELTS GT ${WT==="t1"?"Task 1 letter":"Task 2 essay"}: """${p.t}""". In Russian: tone/type, paragraph-by-paragraph plan with 1-2 ideas each, 8 useful English phrases/collocations, and a model first sentence in English.`,x=>out.innerHTML=`<div class="ai-out">${md(x)}</div>`);}catch(e){out.innerHTML=errBox(e);}}

// ===== VIEWS 3: speaking, medical, videos, tips, mistakes, progress, assistant =====
let SPT="p1",SP1I=0,SP2I=0,P2T=null,P2LEFT=0,P2PH="";
VIEWS.speaking=()=>`<h1>Speaking</h1><p class="muted prose">Цель — говорить свободно. Отвечайте вслух (кнопка «Говорить» превращает речь в текст) или печатайте. ИИ разбирает беглость, лексику и грамматику и предлагает, как сказать лучше. Произношение по тексту оценить нельзя — для него слушайте озвучку и повторяйте.</p>
 <div class="row mt"><span class="chip">Наговорено всего: ${Math.round((S.speakSec||0)/60)} мин</span></div>
 <div class="tabs mt">${[["p1","Part 1"],["p2","Part 2 · карточка"],["chat","Разговор с ИИ"],["cards","Пересказ"],["tips","Как говорить свободно"]].map(([k,n])=>`<button class="${SPT===k?"on":""}" onclick="SPT='${k}';route(true)">${n}</button>`).join("")}</div>${speakBody()}`;
function speakBody(){
  if(SPT==="p1"){const s=SP1[SP1I%SP1.length];return `<div class="row between"><h2>${esc(s.t)}</h2><button class="btn sm" onclick="SP1I++;route(true)">Другая тема →</button></div>
   <p class="muted small">Отвечайте 2–3 предложениями: ответ → причина → пример.</p><div class="stack mt">${s.q.map((q,i)=>`<div class="q stack"><div class="row between"><b>${esc(q)}</b>${sayBtn(q)}</div><textarea id="p1a${i}" style="min-height:70px"></textarea><div>${recBtn("p1a"+i)}</div></div>`).join("")}</div>
   ${AI?`<button class="btn pri mt" id="spBtn" onclick="evalSpeaking('p1')">Получить разбор</button>`:noAI()}<div id="spOut" class="mt"></div>`;}
  if(SPT==="p2"){const c=SP2[SP2I%SP2.length];return `<div class="row between"><h2>Карточка</h2><button class="btn sm" onclick="SP2I++;P2PH='';route(true)">Другая карточка →</button></div>
   <div class="card mt"><b>${esc(c.t)}</b> ${sayBtn(c.t)}<div class="small muted mt">You should say:</div><ul class="small">${c.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
   <div class="row mt"><button class="btn" onclick="p2Timer(60,'Подготовка')">1 мин подготовки</button><button class="btn" onclick="p2Timer(120,'Говорите')">2 мин ответа</button><span class="timer" id="p2tm">${P2PH?P2PH+" "+fmt(P2LEFT):"00:00"}</span></div>
   <textarea id="p2a" class="mt" style="min-height:160px" placeholder="Ваш монолог (голосом или текстом)…"></textarea><div class="row mt">${recBtn("p2a")}</div>
   <h3 class="mt">Part 3 — дискуссия</h3><div class="stack mt">${c.p3.map((q,i)=>`<div class="q stack"><div class="row between"><b>${esc(q)}</b>${sayBtn(q)}</div><textarea id="p3a${i}" style="min-height:70px"></textarea><div>${recBtn("p3a"+i)}</div></div>`).join("")}</div>
   ${AI?`<button class="btn pri mt" id="spBtn" onclick="evalSpeaking('p2')">Получить разбор</button>`:noAI()}<div id="spOut" class="mt"></div>`;}
  if(SPT==="chat")return chatHTML();
  if(SPT==="cards")return `<p class="muted">Пересказ: прослушайте текст и перескажите его своими словами — лучший тренажёр беглости.</p><div class="grid g3 mt">${TEXTS.map((t,i)=>`<a class="card" href="#listening" onclick="LT=${i};LMODE='r';LSHOW=false;"><span class="chip lv lv${t.lvl}">${t.lvl}</span> ${t.med?'<span class="chip med">мед</span>':""}<h3 style="margin-top:10px">${esc(t.t)}</h3><div class="row small">${t.key.slice(0,4).map(k=>`<span class="chip">${esc(k)}</span>`).join(" ")}</div></a>`).join("")}</div>`;
  return `<div class="card prose">${TIPS[5].b}</div><a class="card mt" href="#v-idioms"><h3>Фразы и идиомы для Speaking →</h3></a>`;}
function p2Timer(sec,ph){clearInterval(P2T);P2LEFT=sec;P2PH=ph;const tick=()=>{const el=$("#p2tm");if(el)el.textContent=P2PH+" "+fmt(P2LEFT);};tick();
  P2T=setInterval(()=>{P2LEFT--;tick();if(P2LEFT<=0){clearInterval(P2T);toast(ph==="Подготовка"?"Начинайте говорить!":"Время вышло");if(ph==="Подготовка"){p2Timer(120,"Говорите");}}},1000);}
async function evalSpeaking(part){let qa="";
  if(part==="p1"){const s=SP1[SP1I%SP1.length];qa=s.q.map((q,i)=>`Q: ${q}\nA: ${$("#p1a"+i).value.trim()||"(no answer)"}`).join("\n\n");}
  else{const c=SP2[SP2I%SP2.length];qa=`PART 2 CUE CARD: ${c.t} (${c.p.join("; ")})\nMONOLOGUE: ${$("#p2a").value.trim()||"(no answer)"}\n\n`+c.p3.map((q,i)=>`PART 3 Q: ${q}\nA: ${$("#p3a"+i).value.trim()||"(no answer)"}`).join("\n\n");}
  if(qa.replace(/\(no answer\)/g,"").split(/\s+/).length<25){toast("Ответьте хотя бы на пару вопросов");return;}
  const out=$("#spOut"),b=$("#spBtn");b.disabled=true;
  try{const r=await ask(`You are an IELTS Speaking examiner and friendly coach. The learner is Russian, about CEFR ${S.level}, goal band 6.5 and FLUENT speaking. The answers are speech-to-text transcripts (ignore punctuation/capitalisation; you cannot judge pronunciation).
${qa}
Reply in Russian (English examples in English):
### Оценка
- Fluency & Coherence: X
- Lexical Resource: X
- Grammatical Range & Accuracy: X
- **Примерный балл (без произношения): X**
### Беглость
(length of answers, extending answers, linking, fillers — concrete advice)
### Ошибки
(up to 8: "wrong" → "correct")
### Лексика уровнем выше
(6-8 better words/collocations/idioms she could have used, with the sentence where they fit)
### Образец ответа
(model band-7 answer to ONE of the questions, natural spoken style)`,x=>out.innerHTML=`<div class="ai-out">${md(x)}</div>`);
    const m=r.match(/балл[^0-9]*([0-9](?:[.,]5)?)/i);S.speaks.push({d:today(),part,band:m?parseFloat(m[1].replace(",",".")):null});markPlan("main");save();}catch(e){out.innerHTML=errBox(e);}b.disabled=false;}

let CHAT={title:"Свободный разговор",sys:"",msgs:[],voice:true,busy:false};
function chatStart(title,sys){CHAT={title,sys,msgs:[],voice:CHAT.voice,busy:false};}
const FREE_SYS="You are a friendly English conversation partner for a Russian woman (CEFR ~B1, goal: fluent speaking and IELTS 6.5; she studies medicine, is married, has a small son and a cocker spaniel puppy). Have a natural conversation: reply in 1-3 short sentences, then ask ONE follow-up question. Use B1-B2 English. If she makes a serious mistake, add at the end in brackets one short correction like (Tip: say \"I went\", not \"I goed\"). If she writes in Russian, kindly ask her to try in English and help with words.";
function chatHTML(){if(!AI)return noAI();if(!CHAT.sys)chatStart("Свободный разговор",FREE_SYS);
  return `<div class="row between"><h2>${esc(CHAT.title)}</h2><div class="row"><label class="small row" style="gap:6px"><input type="checkbox" ${CHAT.voice?"checked":""} onchange="CHAT.voice=this.checked"> озвучивать ответы</label><button class="btn sm" onclick="chatStart('Свободный разговор',FREE_SYS);route(true)">Новый разговор</button></div></div>
  <div class="row small mt">${["My day","Medicine","Hobbies","Travel","Food","Family","Technology","IELTS Part 3"].map(t=>`<button class="btn sm" onclick="chatSend('Let\\'s talk about ${t}.')">${t}</button>`).join("")}</div>
  <div class="card mt stack"><div class="chat" id="chatBox">${CHAT.msgs.length?CHAT.msgs.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join(""):`<div class="muted small">Напишите или скажите что-нибудь по-английски — например, «Hi! I had a busy day today».</div>`}</div>
  <div class="row"><input type="text" id="chatIn" placeholder="Ваш ответ по-английски…" onkeydown="if(event.key==='Enter')chatSend()" style="flex:1"><button class="btn sm" id="mic-chatIn" onclick="toggleRec('chatIn')" ${DICT?"":"disabled"}>🎙 Говорить</button><button class="btn pri sm" onclick="chatSend()">Отправить</button></div>
  ${CHAT.msgs.length>3?`<button class="btn sm" onclick="chatReview()" style="align-self:flex-start">Разбор разговора</button>`:""}<div id="chatRev"></div></div>`;}
async function chatSend(txt){const inp=$("#chatIn");txt=txt||(inp&&inp.value.trim());if(!txt||CHAT.busy)return;if(MIC.state==="listening")await micStop();
  CHAT.msgs.push({role:"user",content:txt});if(inp)inp.value="";CHAT.busy=true;route(true);
  const box=$("#chatBox");box.insertAdjacentHTML("beforeend",`<div class="msg ai" id="pend">…</div>`);box.scrollTop=1e6;
  const msgs=CHAT.msgs.map((m,i)=>i===0?{role:"user",content:"[Instructions for you: "+CHAT.sys+"]\n\n"+m.content}:m);
  try{const r=await AI(msgs,{cache:false,modelTier:"quick",onText:({text})=>{const p=$("#pend");if(p)p.textContent=text;box.scrollTop=1e6;}});
    CHAT.msgs.push({role:"assistant",content:r.text});if(CHAT.voice)say(r.text.replace(/\(Tip:[^)]*\)/g,""));S.speakSec=(S.speakSec||0)+txt.split(" ").length*0.5;save();}
  catch(e){CHAT.msgs.push({role:"assistant",content:"(Ошибка: "+(e.message||e.code)+")"});}
  CHAT.busy=false;route(true);const b=$("#chatBox");if(b)b.scrollTop=1e6;const i2=$("#chatIn");if(i2)i2.focus();}
async function chatReview(){const out=$("#chatRev");const mine=CHAT.msgs.filter(m=>m.role==="user").map(m=>m.content).join("\n");
  try{await ask(`Review the learner's side of this English conversation (Russian learner, ~${S.level}). Her messages:\n"""${mine}"""\nIn Russian: ### Что получилось, ### Ошибки (wrong → correct, up to 8), ### Слова и фразы, которые стоит выучить (6-8 with translation), ### Задание на завтра (one speaking task).`,x=>out.innerHTML=`<div class="ai-out mt">${md(x)}</div>`);}catch(e){out.innerHTML=errBox(e);}}

VIEWS.mistakes=()=>`<h1>Тетрадь ошибок</h1><p class="muted">${S.mistakes.length} записей. Повторяйте их в начале занятия.</p>
 <div class="row mt">${AI&&S.mistakes.length?`<button class="btn pri" onclick="mistakeAI()">Разобрать мои ошибки с ИИ</button>`:""}${S.mistakes.length?`<button class="btn" onclick="S.mistakes=[];save();route()">Очистить</button>`:""}</div><div id="mkOut" class="mt"></div>

async function mistakeAI(){const out=$("#mkOut");const list=S.mistakes.slice(0,25).map(m=>`- ${m.q} → correct: ${m.right} (${m.src})`).join("\n");
  try{await ask(`These are a Russian learner's recent English mistakes (question → correct answer):\n${list}\nIn Russian: group them into 3-4 patterns, explain each pattern simply, and give 6 new practice sentences (with answers hidden at the end under "### Ответы").`,x=>out.innerHTML=`<div class="ai-out">${md(x)}</div>`);}catch(e){out.innerHTML=errBox(e);}}
VIEWS.progress=()=>{const e=estimate();const days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*DAY).toISOString().slice(0,10);return [d,Math.round(S.minutes[d]||0)];});const mx=Math.max(30,...days.map(d=>d[1]));
  return `<h1>Прогресс</h1><div class="grid g4 mt">${[["Listening","L"],["Reading","R"],["Writing","W"],["Speaking","S"]].map(([n,k])=>`<div class="card tile"><span class="muted small">${n}</span><span class="num">${e[k].toFixed(1)}</span><span class="small ${e.real[k]?"":"muted"}">${e.real[k]?"по вашим результатам":"оценка по уровню"}</span><div class="bar"><i style="width:${Math.min(100,e[k]/9*100)}%;background:${e[k]>=6.5?"var(--good)":"var(--accent)"}"></i></div></div>`).join("")}</div>
  <div class="card mt"><div class="row between"><h3>Минуты занятий, 14 дней</h3><span class="muted small">цель 20–30 мин/день</span></div>
  <div style="display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:14px;border-bottom:1px solid var(--line);position:relative">
  <div style="position:absolute;left:0;right:0;bottom:${25/mx*100}%;border-top:1px dashed var(--muted);opacity:.5"></div>
  ${days.map(([d,m])=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%" title="${d}: ${m} мин"><span class="small muted" style="font-variant-numeric:tabular-nums">${m||""}</span><div style="width:100%;max-width:28px;height:${m/mx*100}%;background:${m>=20?"var(--good)":"var(--accent)"};border-radius:6px 6px 0 0;min-height:${m?3:0}px"></div></div>`).join("")}</div>
  <div style="display:flex;gap:6px" class="small muted">${days.map(([d])=>`<span style="flex:1;text-align:center">${d.slice(8)}</span>`).join("")}</div></div>
  <h2 class="mt">Уровни</h2><div class="levelmap mt">${LEVELS.map(lv=>{const s=lvlStats(lv);return `<a href="#lv-${lv}" class="lvbox lv${lv}"><b style="font-family:var(--f-display)">${lv}</b><div class="bar"><i style="width:${s.pct}%"></i></div><span class="small">${s.pct}% · слов ${s.lw}/${s.tw}</span></a>`}).join("")}</div>
  <div class="grid g2 mt"><div class="card"><h3>Входной тест</h3><p class="small muted">${S.placed?`Пройден ${S.placed.d}, уровень ${S.placed.lv}`:"Ещё не пройден"}</p><a class="btn sm" href="#test" onclick="PT={i:0,a:[]}">${S.placed?"Пройти снова":"Пройти"}</a></div>
  <div class="card"><h3>Резервная копия</h3><p class="small muted">Прогресс сохраняется автоматически${DBDOC?" в вашем аккаунте и":""} в этом браузере. Копию можно сохранить себе.</p><div class="row"><button class="btn sm" onclick="navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Скопировано'),()=>toast('Не удалось скопировать'))">Скопировать прогресс</button><button class="btn sm" onclick="$('#imp').classList.toggle('hide')">Восстановить</button></div>
  <div id="imp" class="hide mt stack"><textarea id="impT" style="min-height:80px" placeholder="Вставьте скопированный прогресс"></textarea><button class="btn sm pri" onclick="try{S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse($('#impT').value));save();toast('Восстановлено');route()}catch(e){toast('Неверный формат')}">Восстановить</button></div></div></div>`;};

// ----- ASSISTANT drawer -----
let AMSG=[];
const ASYS="You are an AI English tutor inside a personal IELTS General Training prep platform. The learner is a Russian woman, ~B1, target IELTS 6.5, wants fluent speaking and to understand medical topics (she studies medicine). Answer in Russian unless asked otherwise; keep English examples in English. Be concise and practical: rules with 2-3 examples, corrections as wrong → correct. If she pastes an essay, assess it by the 4 IELTS criteria with band scores.";
function openAssist(prefill){$("#drawer").classList.add("open");renderAssist();if(prefill){$("#aIn").value=prefill;assistSend();}}
function renderAssist(){$("#quick").innerHTML=AI?["Объясни разницу Present Perfect и Past Simple","Переведи и объясни: «у меня болит горло»","Проверь моё предложение: ","Дай 10 слов по кардиологии","Как перефразировать вопрос в эссе?"].map(q=>`<button class="btn sm" onclick='$("#aIn").value=${JSON.stringify(q)};$("#aIn").focus()'>${esc(q)}</button>`).join(""):noAI();
  $("#aChat").innerHTML=AMSG.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${m.role==="user"?esc(m.content):md(m.content)}</div>`).join("")||`<div class="muted small">Спросите что угодно: правило, перевод, проверка текста, медицинский термин. Можно надиктовать голосом.</div>`;
  $("#aMic").style.display=DICT?"":"none";}
async function assistSend(){const v=$("#aIn").value.trim();if(!v||!AI)return;if(MIC.state==="listening")await micStop();AMSG.push({role:"user",content:v});$("#aIn").value="";renderAssist();
  const box=$("#aChat");box.insertAdjacentHTML("beforeend",`<div class="msg ai" id="apend">…</div>`);const bd=$("#drawer .bd");bd.scrollTop=1e6;
  const msgs=AMSG.slice(-12).map((m,i)=>i===0?{role:m.role,content:"[Instructions: "+ASYS+"]\n\n"+m.content}:m);if(msgs[0].role!=="user")msgs.shift();
  try{const r=await AI(msgs,{cache:false,onText:({text})=>{const p=$("#apend");if(p)p.innerHTML=md(text);bd.scrollTop=1e6;}});AMSG.push({role:"assistant",content:r.text});}
  catch(e){AMSG.push({role:"assistant",content:"Ошибка: "+(e.message||e.code)});}renderAssist();bd.scrollTop=1e6;}
$("#fab").onclick=()=>openAssist();$("#drawerClose").onclick=()=>$("#drawer").classList.remove("open");$("#aSend").onclick=assistSend;
$("#aIn").addEventListener("keydown",e=>{if(e.key==="Enter")assistSend();});
$("#aMic").onclick=()=>{if(MIC.state==="listening"){micStop();return;}const inp=$("#aIn");let base=inp.value;micStart(f=>{base=(base?base+" ":"")+f;inp.value=base;},p=>inp.value=(base?base+" ":"")+p,st=>$("#aMic").textContent=st==="listening"?"■":"🎙");};
addEventListener("keydown",e=>{if(e.key==="Escape")$("#drawer").classList.remove("open");});


// ===== QUIZLET-STYLE: Заучивание, Тест, Подбор, Карточки =====
// item: {q, a, alts[], d[] (дистракторы), e (пояснение), kind:'v'|'g', src, ex}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function vItems(t){return t.words.map(w=>({kind:"v",q:w.en,a:w.ru,ex:w.ex,src:t.t,tid:t.id}));}
function gItems(g){return g.q.map(x=>({kind:"g",q:x[0],a:x[1][x[2]],d:x[1].filter((o,j)=>j!==x[2]),e:x[3]||"",src:g.t,tid:g.id}));}
function itemsFor(ids){let r=[];ids.forEach(id=>{const t=ALLTOPICS[id];if(!t)return;r=r.concat(t.kind==="g"?gItems(t):vItems(t));});return r;}
const nrm=s=>String(s).toLowerCase().replace(/ё/g,"е").replace(/\(.*?\)/g," ").replace(/[.,!?;:"«»'’]/g," ").replace(/\s+/g," ").trim();
function variants(s){const out=new Set([nrm(s)]);String(s).split(/\s[\/–—→]\s|;|,|\//).forEach(p=>{const n=nrm(p);if(n.length>1)out.add(n);});return [...out];}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[...Array(b.length+1)].map((_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t;}}return d[b.length];}
const writable=it=>it.kind!=="g"||(/_{2,}/.test(it.q)&&it.a.split(/\s+/).length<=5);
function checkWritten(input,answer,g){const a=nrm(input).replace(/\s*\/\s*/g," ");if(!a)return 0;const vs=g?[nrm(answer).replace(/\s*\/\s*/g," ")]:variants(answer);if(vs.includes(a))return 2;if(vs.some(v=>v.length>4&&lev(a,v)<=1))return 1;return 0;} // 2 верно, 1 почти (опечатка), 0 нет
// направление для лексики: prompt/answer
function pa(it,dir){if(it.kind==="g")return {p:it.q,ans:it.a};return dir==="en"?{p:it.a,ans:it.q}:{p:it.q,ans:it.a};}
function mcOptions(it,pool,dir){if(it.kind==="g")return shuf([it.a,...it.d].slice(0,4));
  const key=dir==="en"?"q":"a";const right=it[key];const others=shuf(pool.filter(x=>x!==it&&x[key]!==right)).slice(0,3).map(x=>x[key]);return shuf([right,...others]);}

let QZ=null; // {mode,items,title,...}
function qzBox(){return document.getElementById("qzbox");}
function qzRender(){const b=qzBox();if(!b||!QZ)return;b.innerHTML=QZ.mode==="learn"?learnHTML():QZ.mode==="test"?(QZ.graded?testResultHTML():testHTML()):QZ.mode==="match"?matchHTML():QZ.mode==="cards"?cardsHTML():"";if(QZ.mode==="learn"){const i=document.getElementById("lrnIn");i&&i.focus();}}
function qzStart(mode,items,title,opts){if(!items.length){toast("Нет карточек для этого режима");return;}
  QZ=Object.assign({mode,items,title,pool:items},opts||{});
  if(mode==="learn")learnInit();if(mode==="test")testInit();if(mode==="match")matchInit();if(mode==="cards"){QZ.i=0;QZ.flip=false;QZ.order=shuf(items);QZ.known=0;QZ.unknown=[];}
  if(qzBox()){QZ.page=curView;qzRender();setTimeout(()=>{const b=qzBox();b&&b.scrollIntoView({block:"nearest"});},30);}else{QZ.page="quiz";if(location.hash==="#quiz")route(true);else location.hash="quiz";}}
const MB=[];
function modeBar(ids,title){MB.push({ids,title});const k=MB.length-1;
  return `<div class="grid g4">${[["cards","Карточки","Перевернуть и отметить «знаю»"],["learn","Заучивание","Выбор ответа → написание, пока не запомните"],["test","Тест","Смешанные вопросы с оценкой"],["match","Подбор","Соедините пары на время"]].map(([m,n,d])=>`<button class="card" style="text-align:left;cursor:pointer" onclick="qzStart('${m}',itemsFor(MB[${k}].ids),MB[${k}].title)"><h3>${n}</h3><div class="muted small">${d}</div></button>`).join("")}</div>`;}
// ---------- Карточки ----------
function cardsHTML(){const o=QZ.order;if(QZ.i>=o.length){return `<div class="card stack"><h2>Готово</h2><p>Знаю: <b>${QZ.known}</b> · Ещё учу: <b>${QZ.unknown.length}</b></p><div class="row">${QZ.unknown.length?`<button class="btn pri" onclick="qzStart('cards',QZ.unknown,QZ.title)">Повторить «ещё учу» (${QZ.unknown.length})</button><button class="btn" onclick="qzStart('learn',QZ.unknown,QZ.title)">Заучивание по ним</button>`:""}<button class="btn" onclick="qzStart('cards',QZ.items,QZ.title)">Сначала</button></div></div>`;}
  const it=o[QZ.i];const front=it.kind==="g"?it.q:it.q,back=it.kind==="g"?`<b>${esc(it.a)}</b><small>${esc(it.e)}</small>`:`${esc(it.a)}<small>${esc(it.ex||"")}</small>`;
  return `<div class="row between"><span class="muted small">${QZ.i+1} / ${o.length} · знаю ${QZ.known} · учу ${QZ.unknown.length}</span><button class="btn sm" onclick="QZ.order=shuf(QZ.order);QZ.i=0;qzRender()">Перемешать</button></div><div class="bar mt"><i style="width:${QZ.i/o.length*100}%"></i></div>
  <div class="flash mt" onclick="QZ.flip=!QZ.flip;qzRender()"><div>${QZ.flip?back:`<b>${esc(front)}</b><small>нажмите, чтобы перевернуть</small>`}</div></div>
  <div class="row mt" style="justify-content:center">${it.kind==="v"?sayBtn(it.q):""}</div>
  <div class="grid g2 mt"><button class="btn" style="justify-content:center;border-color:var(--bad);color:var(--bad)" onclick="QZ.unknown.push(QZ.order[QZ.i]);QZ.i++;QZ.flip=false;qzRender()">Ещё учу</button><button class="btn" style="justify-content:center;border-color:var(--good);color:var(--good)" onclick="QZ.known++;QZ.i++;QZ.flip=false;qzRender()">Знаю</button></div>`;}

// ---------- Заучивание (Learn) ----------
function learnInit(){QZ.L=shuf(QZ.items).map(it=>({it,st:0,miss:0}));QZ.round=[];QZ.ri=0;QZ.ans=null;QZ.rn=0;learnNextRound();}
function learnNextRound(){const left=QZ.L.filter(x=>x.st<2).sort((a,b)=>a.st-b.st);QZ.round=left.slice(0,7);QZ.ri=0;QZ.ans=null;QZ.rn++;QZ.roundEnd=false;
  QZ.round.forEach(x=>{if(x.st===0)x.opts=mcOptions(x.it,QZ.pool,"ru");});}
function learnHTML(){const done=QZ.L.filter(x=>x.st>=2).length,N=QZ.L.length;
  const head=`<div class="row between"><span class="small"><b>Освоено ${done} из ${N}</b> · раунд ${QZ.rn}</span><span class="muted small">выбор → написание</span></div><div class="bar mt"><i style="width:${done/N*100}%;background:var(--good)"></i></div>`;
  if(done===N){const hard=QZ.L.filter(x=>x.miss>0).sort((a,b)=>b.miss-a.miss);return head+`<div class="card mt stack"><h2>Всё освоено!</h2><p class="muted">${hard.length?`Сложнее всего далось: ${hard.slice(0,8).map(x=>`<b>${esc(x.it.kind==="g"?x.it.a:x.it.q)}</b>`).join(", ")}`:"Без единой ошибки."}</p><div class="row"><button class="btn pri" onclick="qzStart('test',QZ.items,QZ.title)">Пройти тест</button><button class="btn" onclick="qzStart('learn',QZ.items,QZ.title)">Заново</button>${QZ.items[0].kind==="v"?`<button class="btn" onclick="const n=[...new Set(QZ.items.map(i=>i.tid))].reduce((a,t)=>a+srsAdd(t,ALLTOPICS[t].words.filter(w=>QZ.items.some(i=>i.q===w.en))),0);toast('В интервальное повторение: +'+n)">Добавить в повторение</button>`:""}</div></div>`;}
  if(QZ.roundEnd){return head+`<div class="card mt stack"><h2>Раунд ${QZ.rn} завершён</h2><div class="stack small">${QZ.round.map(x=>`<div class="row between"><span>${esc(x.it.kind==="g"?x.it.q:x.it.q)}</span><span class="chip ${x.st>=2?"ok":""}">${x.st>=2?"освоено":x.st===1?"знакомо":"учим"}</span></div>`).join("")}</div><button class="btn pri" onclick="learnNextRound();qzRender()">Следующий раунд →</button></div>`;}
  const x=QZ.round[QZ.ri],it=x.it;const written=x.st===1;
  let prompt,body;
  if(it.kind==="g"){prompt=`<div class="muted small">${written?((it.q.match(/_{2,}/g)||[]).length>1?"Впишите пропуски через пробел":"Впишите пропущенное"):"Выберите правильный вариант"}</div><div style="font-size:1.2rem">${esc(it.q)}</div>`;}
  else prompt=written?`<div class="muted small">Напишите по-английски</div><div style="font-size:1.3rem">${esc(it.a)}</div>`:`<div class="muted small">Выберите перевод</div><div style="font-size:1.3rem"><b>${esc(it.q)}</b> ${sayBtn(it.q)}</div>`;
  if(!written){body=`<div class="grid g2 mt">${x.opts.map((o,j)=>{let cls="";if(QZ.ans){const right=it.kind==="g"?it.a:it.a;if(o===right)cls="right";else if(j===QZ.ans.j)cls="wrong";}return `<button class="opt ${cls}" style="text-align:left;padding:12px" ${QZ.ans?"disabled":""} onclick="learnMC(${j})"><span class="muted small">${j+1}</span> ${esc(o)}</button>`}).join("")}</div>`;}
  else body=`<div class="row mt"><input type="text" id="lrnIn" autocomplete="off" placeholder="Ваш ответ" ${QZ.ans?"disabled":""} onkeydown="if(event.key==='Enter'){QZ.ans?learnNext():learnWrite()}" style="flex:1"><button class="btn pri" ${QZ.ans?"disabled":""} onclick="learnWrite()">Ответить</button>${QZ.ans?"":`<button class="btn" onclick="learnWrite(true)">Не знаю</button>`}</div>`;
  let fb="";if(QZ.ans){const right=written?(it.kind==="g"?it.a:it.q):it.a;
    fb=QZ.ans.ok?`<div class="fb ok">${QZ.ans.ok===1?"Почти! Опечатка, засчитано. ":"Верно! "}${QZ.ans.ok===1?"Правильно: <b>"+esc(right)+"</b>":""}</div>`
     :`<div class="fb no">Правильный ответ: <b>${esc(right)}</b>${QZ.ans.v?` · ваш: <s>${esc(QZ.ans.v)}</s>`:""}</div>${written&&QZ.ans.v?`<button class="btn sm" onclick="learnOverride()">Я ответила верно</button>`:""}`;
    if(it.e)fb+=`<div class="muted small mt">${esc(it.e)}</div>`;if(it.kind==="v"&&it.ex)fb+=`<div class="muted small">${esc(it.ex)}</div>`;
    fb+=`<button class="btn pri mt" id="lrnNext" onclick="learnNext()">Продолжить →</button>`;}
  return head+`<div class="card mt stack">${prompt}${body}${fb}</div>`;}
function learnMC(j){if(QZ.ans)return;const x=QZ.round[QZ.ri];const ok=x.opts[j]===x.it.a;QZ.ans={j,ok:ok?2:0};learnMark(ok);qzRender();if(ok)setTimeout(()=>{if(QZ&&QZ.ans&&QZ.ans.j===j)learnNext();},700);}
function learnWrite(skip){if(QZ.ans)return;const x=QZ.round[QZ.ri],it=x.it;const v=skip?"":($("#lrnIn").value||"");const right=it.kind==="g"?it.a:it.q;const r=skip?0:checkWritten(v,right,it.kind==="g");QZ.ans={ok:r,v};learnMark(r>0);qzRender();setTimeout(()=>{const b=$("#lrnNext");b&&b.focus();},50);}
function learnMark(ok){const x=QZ.round[QZ.ri];if(ok){x.st++;if(!writable(x.it))x.st=2;}else{x.st=0;x.miss++;x.opts=mcOptions(x.it,QZ.pool,"ru");addMistake(x.it.q,x.it.kind==="g"?x.it.a:x.it.a+" — "+x.it.q,(x.it.kind==="g"?"Грамматика: ":"Лексика: ")+x.it.src);}}
function learnOverride(){const x=QZ.round[QZ.ri];x.st=Math.min(2,x.st+1);x.miss=Math.max(0,x.miss-1);S.mistakes.shift();save();QZ.ans.ok=2;learnNext();}
function learnNext(){QZ.ans=null;QZ.ri++;if(QZ.ri>=QZ.round.length)QZ.roundEnd=true;qzRender();}
addEventListener("keydown",e=>{if(!QZ||QZ.mode!=="learn"||!qzBox()||/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(!QZ.ans&&!QZ.roundEnd){const x=QZ.round[QZ.ri];if(x&&x.st===0&&/^[1-4]$/.test(e.key))learnMC(+e.key-1);}else if(e.key==="Enter"){QZ.roundEnd?(learnNextRound(),qzRender()):learnNext();}});

// ---------- Тест ----------
function testInit(){QZ.cfg=QZ.cfg||{n:Math.min(20,QZ.items.length),types:{w:1,mc:1,tf:1,m:1},dir:"mix"};QZ.graded=false;QZ.setup=true;}
function testHTML(){const c=QZ.cfg;
  if(QZ.setup)return `<div class="card stack"><h2>Настройки теста</h2>
   <label class="row">Вопросов: <input type="number" id="tN" min="4" max="${QZ.items.length}" value="${c.n}" style="width:90px;border:1px solid var(--line);border-radius:8px;padding:6px"> <span class="muted small">из ${QZ.items.length}</span></label>
   <div class="row">${[["w","Письменные"],["mc","Выбор ответа"],["tf","Верно / неверно"],["m","Сопоставление"]].map(([k,n])=>`<label class="row small" style="gap:6px;border:1px solid var(--line);padding:6px 10px;border-radius:10px"><input type="checkbox" id="tt-${k}" ${c.types[k]?"checked":""}> ${n}</label>`).join("")}</div>
   ${QZ.items[0].kind==="v"?`<label class="row small">Отвечать: <select id="tDir" style="width:auto"><option value="mix" ${c.dir==="mix"?"selected":""}>и так, и так</option><option value="ru" ${c.dir==="ru"?"selected":""}>по-русски</option><option value="en" ${c.dir==="en"?"selected":""}>по-английски</option></select></label>`:""}
   <button class="btn pri" style="align-self:flex-start" onclick="testBuild()">Создать тест</button></div>`;
  return `<div class="row between"><h2>Тест: ${esc(QZ.title)}</h2><span class="muted small">${QZ.Q.length} вопросов</span></div><div class="stack mt">${QZ.sections.map(s=>`<h3 class="mt">${s.name} <span class="muted small">(${s.qs.length})</span></h3>${s.qs.map(qi=>testQ(qi)).join("")}`).join("")}</div>
   <div class="row mt"><button class="btn pri" onclick="testGrade()">Проверить тест</button><button class="btn" onclick="QZ.setup=true;qzRender()">Изменить настройки</button></div>`;}
function testBuild(){const c=QZ.cfg;c.n=Math.max(4,Math.min(QZ.items.length,+$("#tN").value||20));["w","mc","tf","m"].forEach(k=>c.types[k]=$("#tt-"+k).checked?1:0);if($("#tDir"))c.dir=$("#tDir").value;
  let types=["w","mc","tf","m"].filter(k=>c.types[k]);if(!types.length)types=["mc"];
  const pick=shuf(QZ.items).slice(0,c.n);const per={};types.forEach(t=>per[t]=[]);pick.forEach((it,i)=>per[types[i%types.length]].push(it));
  if(per.m&&per.m.length<3&&types.length>1){per.mc=(per.mc||[]).concat(per.m);delete per.m;}
  const Q=[];const dirOf=()=>c.dir==="mix"?(Math.random()<.5?"ru":"en"):c.dir;
  (per.w||[]).forEach(it=>{if(writable(it))Q.push({t:"w",it,dir:it.kind==="v"?"en":"ru"});else{const dir="ru";Q.push({t:"mc",it,dir,opts:mcOptions(it,QZ.pool,dir)});}}); // письменно: по-английски
  (per.mc||[]).forEach(it=>{const dir=dirOf();Q.push({t:"mc",it,dir,opts:mcOptions(it,QZ.pool,dir)});});
  (per.tf||[]).forEach(it=>{const truth=Math.random()<.5;let shown;if(it.kind==="g")shown=truth?it.a:shuf(it.d)[0];else{const o=shuf(QZ.pool.filter(x=>x.a!==it.a))[0];shown=truth||!o?it.a:o.a;}Q.push({t:"tf",it,shown,truth:shown===it.a});});
  const ms=per.m||[];for(let i=0;i<ms.length;i+=5){const grp=ms.slice(i,i+5);if(!grp.length)break;const dir=dirOf();Q.push({t:"m",grp,dir,opts:shuf(grp.map(g=>pa(g,dir).ans))});}
  QZ.Q=Q;const nm={w:"Письменные ответы",mc:"Выбор ответа",tf:"Верно или неверно",m:"Сопоставление"};
  QZ.sections=["w","mc","tf","m"].map(t=>({name:nm[t],qs:Q.map((q,i)=>q.t===t?i:-1).filter(i=>i>=0)})).filter(s=>s.qs.length);QZ.A={};QZ.setup=false;qzRender();}
function testQ(i){const q=QZ.Q[i],it=q.it,no=`<span class="muted small">${i+1}.</span>`;
  if(q.t==="w"){const p=it.kind==="g"?it.q:it.a;return `<div class="q"><div>${no} ${esc(p)} <span class="muted small">${it.kind==="g"?((it.q.match(/_{2,}/g)||[]).length>1?"— впишите пропуски через пробел":"— впишите пропуск"):"— по-английски"}</span></div><input type="text" class="mt" autocomplete="off" oninput="QZ.A[${i}]=this.value" value="${esc(QZ.A[i]||"")}"></div>`;}
  if(q.t==="mc"){const p=pa(it,q.dir).p;return `<div class="q"><div>${no} ${esc(p)}</div><div class="opts">${q.opts.map((o,j)=>`<button class="opt" id="tm${i}-${j}" style="${QZ.A[i]===j?"outline:2px solid var(--accent)":""}" onclick="QZ.A[${i}]=${j};document.querySelectorAll('[id^=tm${i}-]').forEach(b=>b.style.outline='');this.style.outline='2px solid var(--accent)'">${esc(o)}</button>`).join("")}</div></div>`;}
  if(q.t==="tf"){const txt=it.kind==="g"?esc(it.q).replace(/_{2,}/,`<u><b>${esc(q.shown)}</b></u>`):`<b>${esc(it.q)}</b> = ${esc(q.shown)}`;
    return `<div class="q"><div>${no} ${txt}</div><div class="opts">${[["Верно",true],["Неверно",false]].map(([n,v])=>`<button class="opt" id="tf${i}-${v}" onclick="QZ.A[${i}]=${v};document.querySelectorAll('[id^=tf${i}-]').forEach(b=>b.style.outline='');this.style.outline='2px solid var(--accent)'">${n}</button>`).join("")}</div></div>`;}
  if(q.t==="m"){QZ.A[i]=QZ.A[i]||{};const L="ABCDE";return `<div class="q"><div>${no} Сопоставьте</div><div class="grid g2 mt"><div class="stack">${q.grp.map((g,k)=>`<div class="row" style="flex-wrap:nowrap"><select style="width:70px" onchange="QZ.A[${i}][${k}]=this.value"><option value="">—</option>${q.opts.map((o,j)=>`<option value="${j}">${L[j]}</option>`).join("")}</select><span>${esc(pa(g,q.dir).p)}</span></div>`).join("")}</div><div class="stack">${q.opts.map((o,j)=>`<div><b>${L[j]}.</b> ${esc(o)}</div>`).join("")}</div></div></div>`;}
  return "";}
function testGrade(){let ok=0,tot=0;QZ.res=QZ.Q.map((q,i)=>{const a=QZ.A[i];
  if(q.t==="m"){return q.grp.map((g,k)=>{tot++;const right=pa(g,q.dir).ans;const got=a&&a[k]!==undefined&&a[k]!==""?q.opts[+a[k]]:"";const good=got===right;if(good)ok++;else addMistake(pa(g,q.dir).p,right,"Тест: "+g.src);return {q,good,p:pa(g,q.dir).p,right,got};});}
  tot++;let good,right,got,p;const it=q.it;
  if(q.t==="w"){right=it.kind==="g"?it.a:it.q;got=a||"";good=checkWritten(got,right,it.kind==="g")>0;p=it.kind==="g"?it.q:it.a;}
  if(q.t==="mc"){right=pa(it,q.dir).ans;got=a!=null?q.opts[a]:"";good=got===right;p=pa(it,q.dir).p;}
  if(q.t==="tf"){right=q.truth?"Верно":"Неверно";got=a===true?"Верно":a===false?"Неверно":"";good=got===right;p=it.kind==="g"?it.q.replace(/_{2,}/,"["+q.shown+"]"):it.q+" = "+q.shown;if(!q.truth)right+=" (правильно: "+it.a+")";}
  if(good)ok++;else addMistake(p,q.t==="tf"?it.a:right,"Тест: "+it.src);return [{q,good,p,right,got,i}];}).flat();
  QZ.score={ok,tot};QZ.graded=true;S.tests=(S.tests||[]);S.tests.push({d:today(),t:QZ.title,ok,tot});save();qzRender();scrollTo(0,(qzBox().offsetTop||0)-80);}
function testResultHTML(){const {ok,tot}=QZ.score,p=Math.round(ok/tot*100);const wrong=QZ.res.filter(r=>!r.good);
  const col=p>=80?"var(--good)":p>=50?"var(--warn)":"var(--bad)";
  return `<div class="card stack"><div class="row" style="gap:24px"><div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(${col} ${p*3.6}deg,var(--line) 0);display:grid;place-items:center"><div style="width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem">${p}%</div></div>
   <div class="stack" style="gap:4px"><h2>${p>=90?"Отлично!":p>=70?"Хороший результат":p>=50?"Неплохо, есть что подтянуть":"Нужно повторить"}</h2><div>Верно: <b style="color:var(--good)">${ok}</b> · Ошибок: <b style="color:var(--bad)">${tot-ok}</b></div></div></div>
   <div class="row">${wrong.length?`<button class="btn pri" onclick="qzStart('learn',[...new Set(QZ.res.filter(r=>!r.good).map(r=>r.q.it||r.q.grp.find(g=>pa(g,r.q.dir).p===r.p)))],QZ.title+' — ошибки')">Заучить ошибки (${wrong.length})</button>`:""}<button class="btn" onclick="QZ.setup=false;testBuild2()">Новый тест</button><button class="btn" onclick="qzStart('match',QZ.items,QZ.title)">Подбор</button></div></div>
   <h3 class="mt">Разбор</h3><div class="stack mt">${QZ.res.map((r,k)=>`<div class="q" style="border-left:4px solid ${r.good?"var(--good)":"var(--bad)"}"><div>${esc(r.p)}</div><div class="small mt">${r.good?`<span style="color:var(--good)">✓ ${esc(r.got)}</span>`:`<span style="color:var(--bad)">✗ ${esc(r.got||"нет ответа")}</span> · правильно: <b>${esc(r.right)}</b>`}</div>${!r.good&&r.q.it&&r.q.it.e?`<div class="muted small">${esc(r.q.it.e)}</div>`:""}</div>`).join("")}</div>`;}
function testBuild2(){QZ.graded=false;QZ.setup=true;qzRender();}

// ---------- Подбор (Match) ----------
function matchInit(){const uniq=[];const seenA=new Set(),seenQ=new Set();shuf(QZ.items).forEach(it=>{const L=it.kind==="g"?it.q.replace(/_{2,}/,"___"):it.q,R=it.a;if(seenA.has(R)||seenQ.has(L)||uniq.length>=6)return;seenA.add(R);seenQ.add(L);uniq.push({L,R});});
  QZ.tiles=shuf(uniq.flatMap((p,k)=>[{k,txt:p.L,side:"L"},{k,txt:p.R,side:"R"}]));QZ.sel=null;QZ.gone=new Set();QZ.t0=null;QZ.pen=0;QZ.bad=null;QZ.done=false;QZ.pairs=uniq.length;
  clearInterval(QZ.tm);}
function matchHTML(){const key="best:"+QZ.title;const best=S.best&&S.best[key];
  if(QZ.done){const t=QZ.final;return `<div class="card stack" style="text-align:center;align-items:center"><h2>Готово за ${t.toFixed(1)} с</h2><p class="muted">${best&&best<t?`Ваш рекорд: ${best.toFixed(1)} с`:"Новый рекорд!"}${QZ.pen?` · штраф за ошибки: +${QZ.pen} с`:""}</p><button class="btn pri" onclick="matchInit();qzRender()">Играть снова</button></div>`;}
  if(!QZ.t0)return `<div class="card stack" style="text-align:center;align-items:center"><h2>Подбор</h2><p class="muted">Соедините все пары как можно быстрее. Неверная пара — +1 секунда.${best?` Рекорд: ${best.toFixed(1)} с.`:""}</p><button class="btn pri" onclick="QZ.t0=Date.now();QZ.tm=setInterval(()=>{const e=$('#mtT');if(e&&QZ.t0)e.textContent=((Date.now()-QZ.t0)/1000+QZ.pen).toFixed(1)},100);qzRender()">Начать игру</button></div>`;
  return `<div class="row between"><span class="muted small">Пар осталось: ${QZ.pairs-QZ.gone.size/2}</span><span class="timer" id="mtT">${((Date.now()-QZ.t0)/1000+QZ.pen).toFixed(1)}</span></div>
  <div class="grid mt" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">${QZ.tiles.map((t,i)=>QZ.gone.has(i)?`<div style="min-height:90px"></div>`:`<button class="card" style="min-height:90px;cursor:pointer;font-size:.95rem;${QZ.sel===i?"border-color:var(--accent);background:var(--accent-soft)":""}${QZ.bad&&QZ.bad.includes(i)?"border-color:var(--bad);background:var(--bad-soft)":""}" onclick="matchClick(${i})">${esc(t.txt)}</button>`).join("")}</div>`;}
function matchClick(i){if(QZ.sel===null){QZ.sel=i;QZ.bad=null;qzRender();return;}if(QZ.sel===i){QZ.sel=null;qzRender();return;}
  const a=QZ.tiles[QZ.sel],b=QZ.tiles[i];if(a.k===b.k&&a.side!==b.side){QZ.gone.add(QZ.sel);QZ.gone.add(i);QZ.sel=null;
    if(QZ.gone.size===QZ.tiles.length){clearInterval(QZ.tm);QZ.final=(Date.now()-QZ.t0)/1000+QZ.pen;QZ.done=true;S.best=S.best||{};const k="best:"+QZ.title;if(!S.best[k]||QZ.final<S.best[k])S.best[k]=QZ.final;save();}}
  else{QZ.pen+=1;QZ.bad=[QZ.sel,i];QZ.sel=null;setTimeout(()=>{if(QZ)QZ.bad=null;qzRender();},450);}qzRender();}

// ---------- Страница «Тесты» ----------
let QB={kind:"v",lv:"B1",med:false,sel:new Set()};
VIEWS.quiz=()=>{const run=QZ?`<div class="card mt" style="border-color:var(--accent)"><div class="row between"><h2>${{learn:"Заучивание",test:"Тест",match:"Подбор",cards:"Карточки"}[QZ.mode]}: ${esc(QZ.title)}</h2><button class="btn sm" onclick="QZ=null;route(true)">Закрыть</button></div><div class="row mt">${["cards","learn","test","match"].map(m=>`<button class="btn sm ${QZ.mode===m?"pri":""}" onclick="qzStart('${m}',QZ.items,QZ.title)">${{learn:"Заучивание",test:"Тест",match:"Подбор",cards:"Карточки"}[m]}</button>`).join("")}</div><div id="qzbox" class="mt"></div></div>`:"";
  const list=QB.kind==="v"?VOCAB.filter(v=>(QB.med?v.med:!v.med)&&(QB.lv==="all"||v.lvl===QB.lv)):GRAMMAR.filter(g=>(QB.lv==="all"||g.lvl===QB.lv)&&(!QB.med||g.med));
  const selIds=[...QB.sel];const n=itemsFor(selIds).length;const due=srsDue();
  return `<h1>Тесты</h1><p class="muted prose">Режимы как в Quizlet: карточки, заучивание (выбор → написание, пока не запомните), тест со смешанными вопросами и подбор пар на время. Выберите темы — можно несколько сразу.</p>${run}
  <div class="card mt stack"><div class="row"><div class="tabs" style="margin:0;border:0">${[["v","Лексика"],["g","Грамматика"]].map(([k,nm])=>`<button class="${QB.kind===k?"on":""}" onclick="QB.kind='${k}';QB.sel=new Set();route(true)">${nm}</button>`).join("")}</div>
   <div class="row">${["A1","A2","B1","B2","C1","all"].map(l=>`<button class="btn sm ${QB.lv===l?"pri":""}" onclick="QB.lv='${l}';route(true)">${l==="all"?"Все":l}</button>`).join("")}<label class="row small" style="gap:6px"><input type="checkbox" ${QB.med?"checked":""} onchange="QB.med=this.checked;QB.sel=new Set();route(true)"> медицина / USMLE</label></div></div>
   <div class="row"><button class="btn sm" onclick="${list.map(t=>`QB.sel.add('${t.id}')`).join(";")||"0"};route(true)">Выбрать все (${list.length})</button><button class="btn sm" onclick="QB.sel=new Set();route(true)">Снять выбор</button><span class="muted small">Выбрано тем: ${QB.sel.size} · карточек: ${n}</span></div>
   <div class="grid g3" style="max-height:380px;overflow-y:auto;padding:2px">${list.map(t=>`<label class="row small" style="gap:8px;border:1px solid ${QB.sel.has(t.id)?"var(--accent)":"var(--line)"};border-radius:10px;padding:8px 10px;flex-wrap:nowrap;cursor:pointer;background:${QB.sel.has(t.id)?"var(--accent-soft)":"var(--surface)"}"><input type="checkbox" ${QB.sel.has(t.id)?"checked":""} onchange="this.checked?QB.sel.add('${t.id}'):QB.sel.delete('${t.id}');route(true)"><span style="flex:1">${esc(t.t)}</span><span class="chip lv lv${t.lvl}">${t.lvl}</span><span class="muted">${t.kind==="g"||!t.words?t.q.length:t.words.length}</span></label>`).join("")||'<span class="muted">Нет тем для этого фильтра.</span>'}</div>
   ${n?modeBar(selIds,selIds.length===1?ALLTOPICS[selIds[0]].t:`${QB.kind==="v"?"Лексика":"Грамматика"}: ${selIds.length} тем`):'<div class="notice">Отметьте одну или несколько тем.</div>'}</div>
  <h2 class="mt">Быстрый старт</h2><div class="grid g3 mt">
   <button class="card" style="text-align:left;cursor:pointer" onclick="qzStart('learn',srsDue().map(k=>{const w=wordByKey(k);return w&&{kind:'v',q:w.en,a:w.ru,ex:w.ex,src:w.tt,tid:w.tid}}).filter(Boolean),'Слова к повторению')"><h3>Слова к повторению</h3><div class="muted small">${due.length} слов из интервального повторения</div></button>
   <button class="card" style="text-align:left;cursor:pointer" onclick="qzStart('test',VOCAB.filter(v=>!v.med&&v.lvl===S.level).flatMap(vItems),'Лексика ${S.level}',{cfg:{n:30,types:{w:1,mc:1,tf:1,m:1},dir:'mix'}})"><h3>Тест по лексике ${S.level}</h3><div class="muted small">30 вопросов из всех тем уровня</div></button>
   <button class="card" style="text-align:left;cursor:pointer" onclick="qzStart('test',GRAMMAR.filter(g=>g.lvl===S.level).flatMap(gItems),'Грамматика ${S.level}',{cfg:{n:25,types:{w:1,mc:1,tf:1,m:0},dir:'ru'}})"><h3>Тест по грамматике ${S.level}</h3><div class="muted small">25 вопросов по всем темам уровня</div></button>
  </div>
  ${(S.tests||[]).length?`<h2 class="mt">История тестов</h2><div class="card mt tw"><table class="vtable small">${S.tests.slice(-10).reverse().map(t=>`<tr><td class="muted">${t.d}</td><td>${esc(t.t)}</td><td><b>${Math.round(t.ok/t.tot*100)}%</b> (${t.ok}/${t.tot})</td></tr>`).join("")}</table></div>`:""}`;};
route();

</script>
